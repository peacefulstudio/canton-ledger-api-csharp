name: Integration (multi-sync, non-gating)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration-multisync:
    name: integration (localnet, multi-sync)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json

      - name: Show docker / compose versions
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: Boot the multi-synchronizer LocalNet (canton-localnet v0.8.4-3)
        uses: peacefulstudio/canton-localnet@1cf682aae212d4e2fefb882bcf9c97ea95036a59 # v0.8.4-3
        with:
          validators: a b c d
          multi-sync: 'true'
          timeout: 25m

      - name: Restore
        run: |
          set -euo pipefail
          dotnet restore tests/Canton.Ledger.Grpc.Client.Integration.Tests/Canton.Ledger.Grpc.Client.Integration.Tests.csproj

      - name: Build
        run: |
          set -euo pipefail
          dotnet build --configuration Release --no-restore \
            tests/Canton.Ledger.Grpc.Client.Integration.Tests/Canton.Ledger.Grpc.Client.Integration.Tests.csproj

      - name: Reassignment write+read conformance tests (multi-sync)
        env:
          CANTON_REASSIGNMENT_REQUIRE_MULTI_SYNC: "1"
        run: |
          set -euo pipefail
          dotnet test --configuration Release --no-build \
            --project tests/Canton.Ledger.Grpc.Client.Integration.Tests/Canton.Ledger.Grpc.Client.Integration.Tests.csproj \
            -- --filter-class Canton.Ledger.Grpc.Client.Integration.Tests.ReassignmentInterfaceFilterConformanceTests \
            --output Detailed

      - name: Restore (REST)
        run: |
          set -euo pipefail
          dotnet restore tests/Canton.Ledger.Rest.Client.Integration.Tests/Canton.Ledger.Rest.Client.Integration.Tests.csproj

      - name: Build (REST)
        run: |
          set -euo pipefail
          dotnet build --configuration Release --no-restore \
            tests/Canton.Ledger.Rest.Client.Integration.Tests/Canton.Ledger.Rest.Client.Integration.Tests.csproj

      - name: REST reassignment conformance tests (multi-sync)
        env:
          CANTON_REASSIGNMENT_REQUIRE_MULTI_SYNC: "1"
        run: |
          set -euo pipefail
          dotnet test --configuration Release --no-build \
            --project tests/Canton.Ledger.Rest.Client.Integration.Tests/Canton.Ledger.Rest.Client.Integration.Tests.csproj \
            -- --filter-class Canton.Ledger.Rest.Client.Integration.Tests.RestReassignmentConformanceTests \
            --output Detailed

      - name: Capture LocalNet state on failure
        if: failure()
        run: |
          set -euo pipefail
          docker ps -a --filter label=com.docker.compose.project=localnet > /tmp/localnet-status.txt 2>&1 || true
          for container in $(docker ps -a --filter label=com.docker.compose.project=localnet --format '{{.Names}}'); do
            echo "===== ${container}"
            timeout 30 docker logs --timestamps --tail 400 "${container}" 2>&1 || true
          done > /tmp/localnet-logs.txt 2>&1 || true
          docker logs multi-sync-startup > /tmp/multi-sync-startup.txt 2>&1 || true
          docker ps -a > /tmp/docker-ps.txt 2>&1 || true

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-multisync-diagnostics
          path: |
            /tmp/localnet-status.txt
            /tmp/localnet-logs.txt
            /tmp/multi-sync-startup.txt
            /tmp/docker-ps.txt
            /tmp/docker-ps-attempt1.txt
            /tmp/logs-attempt1.txt
            /tmp/multi-sync-startup-attempt1.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down LocalNet
        if: always()
        uses: peacefulstudio/canton-localnet/teardown@1cf682aae212d4e2fefb882bcf9c97ea95036a59 # v0.8.4-3

name: Diag Windows TLS

on:
  workflow_dispatch:
  push:
    branches: [diag/windows-tls-amd64]

permissions:
  contents: read

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TEST_EXE: tests/Canton.Ledger.Kernel.Tests/bin/Release/net10.0/Canton.Ledger.Kernel.Tests.exe
      TLS_CLASS: Canton.Ledger.Kernel.Tests.SslClientAuthenticationOptionsFactoryTests
      TLS_METHOD: '*Create_presents_no_client_certificate_when_only_certificate_authorities_are_configured'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Snapshot before
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'snapshot-before.txt'
          & {
            "whoami: $(whoami)"
            "OSVersion: $([Environment]::OSVersion)"
            "OSDescription: $([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)"
            "ProcessArchitecture: $([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)"
            "CurrentUser\My: $((Get-ChildItem Cert:\CurrentUser\My | Measure-Object).Count)"
            Get-ChildItem Cert:\CurrentUser\My | Select-Object Thumbprint, Subject, HasPrivateKey | Format-Table -AutoSize | Out-String
            "LocalMachine\My: $((Get-ChildItem Cert:\LocalMachine\My | Measure-Object).Count)"
            Get-ChildItem Cert:\LocalMachine\My | Select-Object Thumbprint, Subject, HasPrivateKey | Format-Table -AutoSize | Out-String
            "APPDATA RSA files: $((Get-ChildItem -Recurse -File "$env:APPDATA\Microsoft\Crypto\RSA" -ErrorAction SilentlyContinue | Measure-Object).Count)"
            "APPDATA Keys files: $((Get-ChildItem -Recurse -File "$env:APPDATA\Microsoft\Crypto\Keys" -ErrorAction SilentlyContinue | Measure-Object).Count)"
            "SystemKeys files: $((Get-ChildItem -Recurse -File "$env:ProgramData\Microsoft\Crypto\Keys" -ErrorAction SilentlyContinue | Measure-Object).Count)"
          } | Tee-Object -FilePath $out

      - name: Build Kernel.Tests
        run: dotnet build tests/Canton.Ledger.Kernel.Tests -c Release

      - name: A. Baseline, whole TLS class
        continue-on-error: true
        shell: pwsh
        run: |
          $env:TLS_PROBE_LOG = Join-Path $env:RUNNER_TEMP 'baseline.log'
          & $env:TEST_EXE --filter-class $env:TLS_CLASS
          Write-Host "exit=$LASTEXITCODE"
          Get-Content $env:TLS_PROBE_LOG
          exit $LASTEXITCODE

      - name: B1. Isolation, failing test alone
        continue-on-error: true
        shell: pwsh
        run: |
          $env:TLS_PROBE_LOG = Join-Path $env:RUNNER_TEMP 'isolation1.log'
          & $env:TEST_EXE --filter-method $env:TLS_METHOD
          Write-Host "exit=$LASTEXITCODE"
          Get-Content $env:TLS_PROBE_LOG
          exit $LASTEXITCODE

      - name: B2. Isolation again in a fresh process
        continue-on-error: true
        shell: pwsh
        run: |
          $env:TLS_PROBE_LOG = Join-Path $env:RUNNER_TEMP 'isolation2.log'
          & $env:TEST_EXE --filter-method $env:TLS_METHOD
          Write-Host "exit=$LASTEXITCODE"
          Get-Content $env:TLS_PROBE_LOG
          exit $LASTEXITCODE

      - name: C. Probe variants
        continue-on-error: true
        shell: pwsh
        run: |
          $env:TLS_PROBE_LOG = Join-Path $env:RUNNER_TEMP 'probe.log'
          & $env:TEST_EXE --filter-class Canton.Ledger.Kernel.Tests.WindowsTlsProbe
          Write-Host "exit=$LASTEXITCODE"
          Get-Content $env:TLS_PROBE_LOG | Sort-Object
          exit $LASTEXITCODE

      - name: Snapshot after
        if: always()
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'snapshot-after.txt'
          & {
            "CurrentUser\My: $((Get-ChildItem Cert:\CurrentUser\My | Measure-Object).Count)"
            Get-ChildItem Cert:\CurrentUser\My | Select-Object Thumbprint, Subject, HasPrivateKey | Format-Table -AutoSize | Out-String
            "LocalMachine\My: $((Get-ChildItem Cert:\LocalMachine\My | Measure-Object).Count)"
            "APPDATA RSA files: $((Get-ChildItem -Recurse -File "$env:APPDATA\Microsoft\Crypto\RSA" -ErrorAction SilentlyContinue | Measure-Object).Count)"
            "APPDATA Keys files: $((Get-ChildItem -Recurse -File "$env:APPDATA\Microsoft\Crypto\Keys" -ErrorAction SilentlyContinue | Measure-Object).Count)"
            "SystemKeys files: $((Get-ChildItem -Recurse -File "$env:ProgramData\Microsoft\Crypto\Keys" -ErrorAction SilentlyContinue | Measure-Object).Count)"
          } | Tee-Object -FilePath $out
          Write-Host '--- before ---'
          Get-Content (Join-Path $env:RUNNER_TEMP 'snapshot-before.txt') | Select-String 'files:|My:'

name: Diag Windows TLS

on:
  workflow_dispatch:
  push:
    branches: [diag/windows-tls-amd64]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TEST_EXE: tests/Canton.Ledger.Kernel.Tests/bin/Release/net10.0/Canton.Ledger.Kernel.Tests.exe
      TLS_CLASS: Canton.Ledger.Kernel.Tests.SslClientAuthenticationOptionsFactoryTests
      TLS_TEST_FILE: tests/Canton.Ledger.Kernel.Tests/SslClientAuthenticationOptionsFactoryTests.cs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build Kernel.Tests with the fix
        run: dotnet build tests/Canton.Ledger.Kernel.Tests -c Release

      - name: V1. TLS class with the fix, fresh process each
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($attempt in 1,2,3) {
            $summary = & $env:TEST_EXE --filter-class $env:TLS_CLASS | Select-String 'total:|failed:|succeeded:|Expected' | ForEach-Object { $_.Line.Trim() }
            Write-Host "== with-fix attempt=$attempt exit=$LASTEXITCODE $($summary -join ' ')"
          }

      - name: V2. Whole Kernel.Tests assembly with the fix
        continue-on-error: true
        shell: pwsh
        run: |
          $summary = & $env:TEST_EXE | Select-String 'total:|failed:|succeeded:|skipped:' | ForEach-Object { $_.Line.Trim() }
          Write-Host "== whole-assembly with-fix exit=$LASTEXITCODE $($summary -join ' ')"

      - name: M. Mutation, pre-fix test file restored from ddc2b2a
        continue-on-error: true
        shell: pwsh
        run: |
          git checkout ddc2b2a -- $env:TLS_TEST_FILE
          git diff --stat HEAD -- $env:TLS_TEST_FILE
          dotnet build tests/Canton.Ledger.Kernel.Tests -c Release
          foreach ($attempt in 1,2) {
            $summary = & $env:TEST_EXE --filter-class $env:TLS_CLASS | Select-String 'total:|failed:|succeeded:|failed Canton|Expected' | ForEach-Object { $_.Line.Trim() }
            Write-Host "== mutant attempt=$attempt exit=$LASTEXITCODE $($summary -join ' | ')"
          }

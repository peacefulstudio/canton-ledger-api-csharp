name: Diag Windows TLS

on:
  workflow_dispatch:
  push:
    branches: [diag/windows-tls-amd64]

permissions:
  contents: read

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TEST_EXE: tests/Canton.Ledger.Kernel.Tests/bin/Release/net10.0/Canton.Ledger.Kernel.Tests.exe
      TLS_CLASS: Canton.Ledger.Kernel.Tests.SslClientAuthenticationOptionsFactoryTests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build Kernel.Tests
        run: dotnet build tests/Canton.Ledger.Kernel.Tests -c Release

      - name: F. Real class under each candidate fix, fresh process each
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($fix in 'none','f1','f2','f4') {
            foreach ($attempt in 1,2) {
              $env:TLS_FIX = $fix
              $env:TLS_PROBE_LOG = Join-Path $env:RUNNER_TEMP "f-$fix-$attempt.log"
              $summary = & $env:TEST_EXE --filter-class $env:TLS_CLASS | Select-String 'total:|failed:|succeeded:' | ForEach-Object { $_.Line.Trim() }
              Write-Host "== fix=$fix attempt=$attempt exit=$LASTEXITCODE $($summary -join ' ')"
              Get-Content $env:TLS_PROBE_LOG | Where-Object { $_ -match 'HANDSHAKE' } | ForEach-Object { $_ -replace ' pid=\d+','' -replace '\(issued:.*','' }
            }
          }
          $env:TLS_FIX = ''

      - name: D2. Preface scenarios, one fresh process each
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($s in 'R16_','R17_','R18_') {
            $env:TLS_PROBE_LOG = Join-Path $env:RUNNER_TEMP "d2-$s.log"
            & $env:TEST_EXE --filter-method "*$s*" | Out-Null
            Write-Host "== $s exit=$LASTEXITCODE"
            Get-Content $env:TLS_PROBE_LOG | Where-Object { $_ -match 'RESULT|ERROR|preface' } | ForEach-Object { $_ -replace ' pid=\d+','' -replace '\(issued:.*','' }
          }

name: Diag Windows TLS

on:
  workflow_dispatch:
  push:
    branches: [diag/windows-tls-amd64]

permissions:
  contents: read

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TEST_EXE: tests/Canton.Ledger.Kernel.Tests/bin/Release/net10.0/Canton.Ledger.Kernel.Tests.exe
      TLS_CLASS: Canton.Ledger.Kernel.Tests.SslClientAuthenticationOptionsFactoryTests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build Kernel.Tests
        run: dotnet build tests/Canton.Ledger.Kernel.Tests -c Release

      - name: A1. Baseline whole TLS class with handshake chronology
        continue-on-error: true
        shell: pwsh
        run: |
          $env:TLS_PROBE_LOG = Join-Path $env:RUNNER_TEMP 'a1.log'
          & $env:TEST_EXE --filter-class $env:TLS_CLASS
          Write-Host "exit=$LASTEXITCODE"
          Get-Content $env:TLS_PROBE_LOG | Where-Object { $_ -match 'HANDSHAKE|REAL-TEST|kind=client' }
          exit $LASTEXITCODE

      - name: A2. Baseline again in a fresh process
        continue-on-error: true
        shell: pwsh
        run: |
          $env:TLS_PROBE_LOG = Join-Path $env:RUNNER_TEMP 'a2.log'
          & $env:TEST_EXE --filter-class $env:TLS_CLASS
          Write-Host "exit=$LASTEXITCODE"
          Get-Content $env:TLS_PROBE_LOG | Where-Object { $_ -match 'HANDSHAKE|REAL-TEST' }
          exit $LASTEXITCODE

      - name: D. Carry-over scenarios, one fresh process each
        continue-on-error: true
        shell: pwsh
        run: |
          $scenarios = 'R01_','R02_','R03_','R04_','R05_','R06_','R07_','R08_','R09_','R10_','R11_','R12_','R13_','R14_','R15_'
          foreach ($s in $scenarios) {
            $env:TLS_PROBE_LOG = Join-Path $env:RUNNER_TEMP "d-$s.log"
            & $env:TEST_EXE --filter-method "*$s*" | Out-Null
            Write-Host "== $s exit=$LASTEXITCODE"
            Get-Content $env:TLS_PROBE_LOG | Where-Object { $_ -match 'RESULT|ERROR|present-step|protocol=' }
          }

      - name: E. Carry-over class in a single process
        continue-on-error: true
        shell: pwsh
        run: |
          $env:TLS_PROBE_LOG = Join-Path $env:RUNNER_TEMP 'e.log'
          & $env:TEST_EXE --filter-class Canton.Ledger.Kernel.Tests.WindowsTlsCarryOverProbe
          Write-Host "exit=$LASTEXITCODE"
          Get-Content $env:TLS_PROBE_LOG | Where-Object { $_ -match 'RESULT|ERROR' }

name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  harness:
    name: harness present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.probe.outputs.present }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Probe for the benchmark harness
        id: probe
        run: |
          set -euo pipefail
          if [[ -f benchmarks/Canton.Ledger.Benchmarks/Canton.Ledger.Benchmarks.csproj ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::benchmarks/Canton.Ledger.Benchmarks is not on this ref yet; nothing to run."
            echo "Benchmark harness not found on \`${GITHUB_REF_NAME}\`; the benchmark job was skipped." >> "${GITHUB_STEP_SUMMARY}"
          fi

  benchmarks:
    name: benchmarks (localnet)
    needs: harness
    if: needs.harness.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_TRAFFIC_THROUGHPUT: '200000'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json

      - name: Boot LocalNet with PQS on a-validator-1 (canton-localnet v0.8.4-3)
        uses: peacefulstudio/canton-localnet@1cf682aae212d4e2fefb882bcf9c97ea95036a59 # v0.8.4-3
        with:
          validators: a
          pqs: 'true'
          timeout: 20m

      - name: Build the benchmark harness
        run: |
          set -euo pipefail
          dotnet build --configuration Release benchmarks/Canton.Ledger.Benchmarks/Canton.Ledger.Benchmarks.csproj

      - name: Priming pass (uploads the benchmark DAR; PQS not measured)
        env:
          CANTON_LOCALNET_A_VALIDATOR_1_PQS_CONNECTION_STRING: ''
        run: |
          set -euo pipefail
          dotnet run --configuration Release --no-build --project benchmarks/Canton.Ledger.Benchmarks -- \
            --warmup 1 --seed-contracts 1 --acs-contracts 1 --latency-samples 1 --tail-samples 1 \
            --pqs-lag-samples 1 --pqs-rows 1 --repetitions 1 --output "${RUNNER_TEMP}/priming"

      - name: Run benchmarks
        run: |
          set -euo pipefail
          dotnet run --configuration Release --no-build --project benchmarks/Canton.Ledger.Benchmarks -- \
            --output "${RUNNER_TEMP}/benchmark-results"
          cat "${RUNNER_TEMP}/benchmark-results/results.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: ${{ runner.temp }}/benchmark-results
          if-no-files-found: warn
          retention-days: 90

      - name: Capture LocalNet state on failure
        if: failure()
        run: |
          set -euo pipefail
          docker ps -a --filter label=com.docker.compose.project=localnet > /tmp/localnet-status.txt 2>&1 || true
          for container in $(docker ps -a --filter label=com.docker.compose.project=localnet --format '{{.Names}}'); do
            echo "===== ${container}"
            timeout 30 docker logs --timestamps --tail 400 "${container}" 2>&1 || true
          done > /tmp/localnet-logs.txt 2>&1 || true
          docker ps -a > /tmp/docker-ps.txt 2>&1 || true

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-diagnostics
          path: |
            /tmp/localnet-status.txt
            /tmp/localnet-logs.txt
            /tmp/docker-ps.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down LocalNet
        if: always()
        uses: peacefulstudio/canton-localnet/teardown@1cf682aae212d4e2fefb882bcf9c97ea95036a59 # v0.8.4-3

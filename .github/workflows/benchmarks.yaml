name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  harness:
    name: harness present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.probe.outputs.present }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Probe for the benchmark harness
        id: probe
        run: |
          set -euo pipefail
          if [[ -f benchmarks/Canton.Ledger.Benchmarks/Canton.Ledger.Benchmarks.csproj ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::benchmarks/Canton.Ledger.Benchmarks is not on this ref yet; nothing to run."
            echo "Benchmark harness not found on \`${GITHUB_REF_NAME}\`; the benchmark job was skipped." >> "${GITHUB_STEP_SUMMARY}"
          fi

  benchmarks:
    name: benchmarks (localnet)
    needs: harness
    if: needs.harness.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LOCALNET_DIR: ${{ github.workspace }}/canton-localnet
      LOCALNET_GRPC_URL: http://localhost:11901
      LOCALNET_JSON_API_URL: http://localhost:11975
      LOCALNET_TOKEN_URL: http://localhost:8082/realms/AValidator1/protocol/openid-connect/token
      TARGET_TRAFFIC_THROUGHPUT: '200000'
      CANTON_LOCALNET_PROFILE: a-validator-1
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Checkout canton-localnet (fixtures + compose stack)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: peacefulstudio/canton-localnet
          ref: dev
          path: canton-localnet
          persist-credentials: false

      - name: Read validator OAuth2 client credentials from LocalNet fixtures
        run: |
          set -euo pipefail
          oauth2_env="${LOCALNET_DIR}/compose/modules/keycloak/env/a-validator-1/on/oauth2.env"
          read_fixture_value() {
            value="$(grep -m 1 -oP "^${1}=\K\S+" "${oauth2_env}")" \
              || { echo "::error::${1} not found in ${oauth2_env}" >&2; return 1; }
            value="${value%\"}"
            printf '%s' "${value#\"}"
          }
          client_id="$(read_fixture_value AUTH_A_VALIDATOR_1_VALIDATOR_CLIENT_ID)"
          client_secret="$(read_fixture_value AUTH_A_VALIDATOR_1_VALIDATOR_CLIENT_SECRET)"
          echo "::add-mask::${client_secret}"
          {
            echo "CANTON_LOCALNET_A_VALIDATOR_1_GRPC_URL=${LOCALNET_GRPC_URL}"
            echo "CANTON_LOCALNET_A_VALIDATOR_1_JSON_API_URL=${LOCALNET_JSON_API_URL}"
            echo "CANTON_LOCALNET_A_VALIDATOR_1_TOKEN_URL=${LOCALNET_TOKEN_URL}"
            echo "CANTON_LOCALNET_A_VALIDATOR_1_CLIENT_ID=${client_id}"
            echo "CANTON_LOCALNET_A_VALIDATOR_1_CLIENT_SECRET=${client_secret}"
          } >> "${GITHUB_ENV}"

      - name: Read PQS connection string from LocalNet fixtures
        run: |
          set -euo pipefail
          common_env="${LOCALNET_DIR}/compose/modules/localnet/env/common.env"
          raw="$(grep -m 1 -oP '^DB_PASSWORD=\K\S+' "${common_env}" || true)"
          [[ -n "${raw}" ]] || { echo "::error::DB_PASSWORD not found in ${common_env}" >&2; exit 1; }
          if [[ "${raw}" == '${DB_PASSWORD:-'*'}' ]]; then
            file_default="${raw#\$\{DB_PASSWORD:-}"
            file_default="${file_default%\}}"
            db_password="${DB_PASSWORD:-${file_default}}"
          else
            db_password="${raw}"
          fi
          echo "::add-mask::${db_password}"
          pqs_conn="Host=localhost;Port=5432;Database=pqs-a-validator-1;Username=cnadmin;Password=${db_password}"
          echo "::add-mask::${pqs_conn}"
          echo "PQS_CONNECTION_STRING=${pqs_conn}" >> "${GITHUB_ENV}"

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'
          cache-dependency-path: canton-localnet/cli/go.sum

      - name: Build canton-localnet CLI
        working-directory: canton-localnet/cli
        run: |
          set -euo pipefail
          go build -o "${LOCALNET_DIR}/canton-localnet" ./cmd/canton-localnet

      - name: Configure a minimal LocalNet (one authenticated validator, PQS on)
        working-directory: canton-localnet
        run: |
          set -euo pipefail
          # The default topology (SV + four validators in one canton JVM) OOM-restarts
          # on ubuntu-latest; slot selection is config-file only (no CLI flag).
          cat > canton-localnet.yaml <<'YAML'
          schemaVersion: preview-1
          modules:
            obs: false
            pqs: true
          validators:
            a-validator-1:
              enabled: true
            b-validator-1:
              enabled: false
            c-validator-1:
              enabled: false
            d-validator-1:
              enabled: false
          YAML

      - name: Bring up LocalNet (one retry on splice bootstrap race)
        working-directory: canton-localnet
        run: |
          set -euo pipefail
          # Splice's SV-validator can lose a startup race on slower runners
          # ("No active synchronizer serial found"); mirrors integration.yaml.
          if ! "${LOCALNET_DIR}/canton-localnet" up; then
            echo "::warning::canton-localnet up failed on first attempt — tearing down with volumes and retrying once"
            "${LOCALNET_DIR}/canton-localnet" down --volumes || echo "::warning::pre-retry teardown failed; second up may fail with leaked state"
            sleep 30
            "${LOCALNET_DIR}/canton-localnet" up
          fi

      - name: Build the benchmark harness
        run: |
          set -euo pipefail
          dotnet build --configuration Release benchmarks/Canton.Ledger.Benchmarks/Canton.Ledger.Benchmarks.csproj

      - name: Wait for ledger + PQS readiness
        working-directory: canton-localnet
        run: |
          set -euo pipefail
          "${LOCALNET_DIR}/canton-localnet" wait-ready --timeout 15m --interval 5s

      - name: Priming pass (uploads the benchmark DAR; PQS not measured)
        run: |
          set -euo pipefail
          dotnet run --configuration Release --no-build --project benchmarks/Canton.Ledger.Benchmarks -- \
            --warmup 1 --seed-contracts 1 --acs-contracts 1 --latency-samples 1 --tail-samples 1 \
            --pqs-lag-samples 1 --pqs-rows 1 --repetitions 1 --output "${RUNNER_TEMP}/priming"

      - name: Run benchmarks
        env:
          CANTON_LOCALNET_A_VALIDATOR_1_PQS_CONNECTION_STRING: ${{ env.PQS_CONNECTION_STRING }}
        run: |
          set -euo pipefail
          dotnet run --configuration Release --no-build --project benchmarks/Canton.Ledger.Benchmarks -- \
            --output "${RUNNER_TEMP}/benchmark-results"
          cat "${RUNNER_TEMP}/benchmark-results/results.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: ${{ runner.temp }}/benchmark-results
          if-no-files-found: warn
          retention-days: 90

      - name: Capture LocalNet state on failure
        if: failure()
        working-directory: canton-localnet
        run: |
          set -euo pipefail
          make status > /tmp/localnet-status.txt 2>&1 || true
          timeout 30 make logs > /tmp/localnet-logs.txt 2>&1 || true
          docker ps -a > /tmp/docker-ps.txt 2>&1 || true

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-diagnostics
          path: |
            /tmp/localnet-status.txt
            /tmp/localnet-logs.txt
            /tmp/docker-ps.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down LocalNet
        if: always()
        working-directory: canton-localnet
        run: |
          set -euo pipefail
          "${LOCALNET_DIR}/canton-localnet" down --volumes || echo "::warning::teardown failed (non-fatal in CI; runner is ephemeral)"

name: Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  integration:
    name: integration (localnet)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json

      - name: Show docker / compose versions
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: Boot LocalNet with PQS on a-validator-1 (canton-localnet v0.8.4-3)
        id: ready
        uses: peacefulstudio/canton-localnet@1cf682aae212d4e2fefb882bcf9c97ea95036a59 # v0.8.4-3
        with:
          validators: a
          pqs: 'true'
          timeout: 20m

      - name: Restore
        run: |
          set -euo pipefail
          dotnet restore tests/Canton.Ledger.Grpc.Client.Integration.Tests/Canton.Ledger.Grpc.Client.Integration.Tests.csproj
          dotnet restore tests/Canton.Ledger.Rest.Client.Integration.Tests/Canton.Ledger.Rest.Client.Integration.Tests.csproj
          dotnet restore tests/Canton.Ledger.Client.Parity.Tests/Canton.Ledger.Client.Parity.Tests.csproj

      - name: Build
        id: build
        run: |
          set -euo pipefail
          dotnet build --configuration Release --no-restore \
            tests/Canton.Ledger.Grpc.Client.Integration.Tests/Canton.Ledger.Grpc.Client.Integration.Tests.csproj
          dotnet build --configuration Release --no-restore \
            tests/Canton.Ledger.Rest.Client.Integration.Tests/Canton.Ledger.Rest.Client.Integration.Tests.csproj
          dotnet build --configuration Release --no-restore \
            tests/Canton.Ledger.Client.Parity.Tests/Canton.Ledger.Client.Parity.Tests.csproj

      - name: Integration tests (except PQS round-trip)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.ready.outcome == 'success' }}
        run: |
          set -euo pipefail
          dotnet test --configuration Release --no-build \
            --project tests/Canton.Ledger.Grpc.Client.Integration.Tests/Canton.Ledger.Grpc.Client.Integration.Tests.csproj \
            -- --filter-trait "Category=Integration" \
            --filter-not-class Canton.Ledger.Grpc.Client.Integration.Tests.PqsRoundTripTests \
            --output Detailed 2>&1 | tee "${RUNNER_TEMP}/grpc-integration.log"
          .github/scripts/assert-tests-ran.sh "${RUNNER_TEMP}/grpc-integration.log" "gRPC integration tests" 16 3

      - name: PQS round-trip test
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.ready.outcome == 'success' }}
        run: |
          set -euo pipefail
          dotnet test --configuration Release --no-build \
            --project tests/Canton.Ledger.Grpc.Client.Integration.Tests/Canton.Ledger.Grpc.Client.Integration.Tests.csproj \
            -- --filter-class Canton.Ledger.Grpc.Client.Integration.Tests.PqsRoundTripTests \
            --output Detailed 2>&1 | tee "${RUNNER_TEMP}/pqs-round-trip.log"
          .github/scripts/assert-tests-ran.sh "${RUNNER_TEMP}/pqs-round-trip.log" "PQS round-trip test" 2 0

      - name: REST conformance tests (JSON Ledger API)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.ready.outcome == 'success' }}
        run: |
          set -euo pipefail
          dotnet test --configuration Release --no-build \
            --project tests/Canton.Ledger.Rest.Client.Integration.Tests/Canton.Ledger.Rest.Client.Integration.Tests.csproj \
            -- --filter-trait "Category=Integration" \
            --output Detailed 2>&1 | tee "${RUNNER_TEMP}/rest-conformance.log"
          .github/scripts/assert-tests-ran.sh "${RUNNER_TEMP}/rest-conformance.log" "REST conformance tests" 35 3

      - name: Cross-transport parity tests (Fake, gRPC, REST against LocalNet)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.ready.outcome == 'success' }}
        run: |
          set -euo pipefail
          dotnet test --configuration Release --no-build \
            --project tests/Canton.Ledger.Client.Parity.Tests/Canton.Ledger.Client.Parity.Tests.csproj \
            -- --filter-trait "Category=Integration" \
            --output Detailed 2>&1 | tee "${RUNNER_TEMP}/parity.log"
          .github/scripts/assert-tests-ran.sh "${RUNNER_TEMP}/parity.log" "Cross-transport parity tests" 44 1

      - name: Capture LocalNet state on failure
        if: failure()
        run: |
          set -euo pipefail
          docker ps -a --filter label=com.docker.compose.project=localnet > /tmp/localnet-status.txt 2>&1 || true
          for container in $(docker ps -a --filter label=com.docker.compose.project=localnet --format '{{.Names}}'); do
            echo "===== ${container}"
            timeout 30 docker logs --timestamps --tail 400 "${container}" 2>&1 || true
          done > /tmp/localnet-logs.txt 2>&1 || true
          docker ps -a > /tmp/docker-ps.txt 2>&1 || true

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-diagnostics
          path: |
            /tmp/localnet-status.txt
            /tmp/localnet-logs.txt
            /tmp/docker-ps.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down LocalNet
        if: always()
        uses: peacefulstudio/canton-localnet/teardown@1cf682aae212d4e2fefb882bcf9c97ea95036a59 # v0.8.4-3

                traceContext:
                    allOf:
                        - $ref: '#/components/schemas/TraceContext'
                    description: |-
                        Ledger API trace context

                         The trace context transported in this message corresponds to the trace context supplied
                         by the client application in a HTTP2 header of the original command submission.
                         We typically use a header to transfer this type of information. Here we use message
                         body, because it is used in gRPC streams which do not support per message headers.
                         This field will be populated with the trace context contained in the original submission.
                         If that was not provided, a unique ledger-api-server generated trace context will be used
                         instead.

                         Optional
        TraceContext:
            type: object
            properties:
                traceparent:
                    type: string
                    description: |-
                        https://www.w3.org/TR/trace-context/

                         Optional
                tracestate:
                    type: string
                    description: Optional
        Transaction:
            type: object
            properties:
                updateId:
                    type: string
                    description: |-
                        Assigned by the server. Useful for correlating logs.
                         Must be a valid LedgerString (as described in ``value.proto``).

                         Required
                commandId:
                    type: string
                    description: |-
                        The ID of the command which resulted in this transaction. Missing for everyone except the submitting party.
                         Must be a valid LedgerString (as described in ``value.proto``).

                         Optional
                workflowId:
                    type: string
                    description: |-
                        The workflow ID used in command submission.
                         Must be a valid LedgerString (as described in ``value.proto``).

                         Optional
                effectiveAt:
                    type: string
                    description: |-
                        Ledger effective time.

                         Required
                    format: date-time
                events:
                    type: array
                    items:
                        $ref: '#/components/schemas/Event'
                    description: |-
                        The collection of events.
                         Contains:

                         - ``CreatedEvent`` or ``ArchivedEvent`` in case of ACS_DELTA transaction shape
                         - ``CreatedEvent`` or ``ExercisedEvent`` in case of LEDGER_EFFECTS transaction shape

                         Required: must be non-empty
                offset:
                    type: string
                    description: |-
                        The absolute offset. The details of this field are described in ``community/ledger-api/README.md``.
                         It is a valid absolute offset (positive integer).

                         Required
                synchronizerId:
                    type: string
                    description: |-
                        A valid synchronizer id.
                         Identifies the synchronizer that synchronized the transaction.

                         Required
                traceContext:
                    allOf:
                        - $ref: '#/components/schemas/TraceContext'
                    description: |-
                        Ledger API trace context

                         The trace context transported in this message corresponds to the trace context supplied
                         by the client application in a HTTP2 header of the original command submission.
                         We typically use a header to transfer this type of information. Here we use message
                         body, because it is used in gRPC streams which do not support per message headers.
                         This field will be populated with the trace context contained in the original submission.
                         If that was not provided, a unique ledger-api-server generated trace context will be used
                         instead.

                         Optional
                recordTime:
                    type: string
                    description: |-
                        The time at which the transaction was recorded. The record time refers to the synchronizer
                         which synchronized the transaction.

                         Required
                    format: date-time
                externalTransactionHash:
                    type: string
                    description: |-
                        For transaction externally signed, contains the external transaction hash
                         signed by the external party. Can be used to correlate an external submission with a committed transaction.

                         Optional: can be empty
                    format: bytes
                paidTrafficCost:
                    type: string
                    description: |-
                        The traffic cost that this participant node paid for the confirmation
                         request for this transaction.

                         Not set for transactions that were
                         - initiated by another participant
                         - initiated offline via the repair service
                         - processed before the participant started serving traffic cost on the Ledger API
                         - returned as part of a query filtering for a non submitting party

                         Optional
            description: Filtered view of an on-ledger transaction's create and archive events.
        TransactionFormat:
            type: object
            properties:
                eventFormat:
                    allOf:
                        - $ref: '#/components/schemas/EventFormat'
                    description: Required
                transactionShape:
                    enum:
                        - TRANSACTION_SHAPE_UNSPECIFIED
                        - TRANSACTION_SHAPE_ACS_DELTA
                        - TRANSACTION_SHAPE_LEDGER_EFFECTS
                    type: string
                    description: |-
                        What transaction shape to use for interpreting the filters of the event format.

                         Required
                    format: enum
            description: |-
                A format that specifies what events to include in Daml transactions
                 and what data to compute and include for them.
        UnassignCommand:
            type: object
            properties:
                contractId:
                    type: string
                    description: |-
                        The ID of the contract the client wants to unassign.
                         Must be a valid LedgerString (as described in ``value.proto``).

                         Required
                source:
                    type: string
                    description: |-
                        The ID of the source synchronizer
                         Must be a valid synchronizer id

                         Required
                target:
                    type: string
                    description: |-
                        The ID of the target synchronizer
                         Must be a valid synchronizer id

                         Required
            description: Unassign a contract
        UnassignedEvent:
            type: object
            properties:
                reassignmentId:
                    type: string
                    description: |-
                        The ID of the unassignment. This needs to be used as an input for a assign ReassignmentCommand.
                         Must be a valid LedgerString (as described in ``value.proto``).

                         Required
                contractId:
                    type: string
                    description: |-
                        The ID of the reassigned contract.
                         Must be a valid LedgerString (as described in ``value.proto``).

                         Required
                templateId:
                    allOf:
                        - $ref: '#/components/schemas/Identifier'
                    description: |-
                        The template of the reassigned contract.
                         The identifier uses the package-id reference format.

                         Required
                source:
                    type: string
                    description: |-
                        The ID of the source synchronizer
                         Must be a valid synchronizer id

                         Required
                target:
                    type: string
                    description: |-
                        The ID of the target synchronizer
                         Must be a valid synchronizer id

                         Required
                submitter:
                    type: string
                    description: |-
                        Party on whose behalf the unassign command was executed.
                         Empty if the unassignment happened offline via the repair service.
                         Must be a valid PartyIdString (as described in ``value.proto``).

                         Optional
                reassignmentCounter:
                    type: string
                    description: |-
                        Each corresponding assigned and unassigned event has the same reassignment_counter. This strictly increases
                         with each unassign command for the same contract. Creation of the contract corresponds to reassignment_counter
                         equals zero.

                         Required
                assignmentExclusivity:
                    type: string
                    description: |-
                        Assignment exclusivity
                         Before this time (measured on the target synchronizer), only the submitter of the unassignment can initiate the assignment
                         Defined for reassigning participants.

                         Optional
                    format: date-time
                witnessParties:
                    type: array
                    items:
                        type: string
                    description: |-
                        The parties that are notified of this event.

                         Required: must be non-empty
                packageName:
                    type: string
                    description: |-
                        The package name of the contract.

                         Required
                offset:
                    type: string
                    description: |-
                        The offset of origin.
                         Offsets are managed by the participant nodes.
                         Reassignments can thus NOT be assumed to have the same offsets on different participant nodes.
                         Must be a valid absolute offset (positive integer)

                         Required
                nodeId:
                    type: integer
                    description: |-
                        The position of this event in the originating reassignment.
                         Node IDs are not necessarily equal across participants,
                         as these may see different projections/parts of reassignments.
                         Must be valid node ID (non-negative integer)

                         Required
                    format: int32
            description: Records that a contract has been unassigned, and it becomes unusable on the source synchronizer
        Update:
            type: object
            properties:
                Transaction:
                    $ref: '#/components/schemas/Transaction'
                Reassignment:
                    $ref: '#/components/schemas/Reassignment'
                OffsetCheckpoint:
                    $ref: '#/components/schemas/OffsetCheckpoint'
                TopologyTransaction:
                    $ref: '#/components/schemas/TopologyTransaction'
            description: The update that matches the filter in the request.
        UpdateFormat:
            type: object
            properties:
                includeTransactions:
                    allOf:
                        - $ref: '#/components/schemas/TransactionFormat'
                    description: |-
                        Include Daml transactions in streams.
                         If unset, no transactions are emitted in the stream.

                         Optional
                includeReassignments:
                    allOf:
                        - $ref: '#/components/schemas/EventFormat'
                    description: |-
                        Include (un)assignments in the stream.
                         The events in the result take the shape TRANSACTION_SHAPE_ACS_DELTA.
                         If unset, no (un)assignments are emitted in the stream.

                         Optional
                includeTopologyEvents:
                    allOf:
                        - $ref: '#/components/schemas/TopologyFormat'
                    description: |-
                        Include topology events in streams.
                         If unset no topology events are emitted in the stream.

                         Optional
            description: A format specifying what updates to include and how to render them.
        UpdateIdentityProviderConfigRequest:
            type: object
            properties:
                identityProviderConfig:
                    allOf:
                        - $ref: '#/components/schemas/IdentityProviderConfig'
                    description: |-
                        The identity provider config to update.
                         Modifiable

                         Required
                updateMask:
                    type: string
                    description: |-
                        An update mask specifies how and which properties of the ``IdentityProviderConfig`` message are to be updated.
                         An update mask consists of a set of update paths.
                         A valid update path points to a field or a subfield relative to the ``IdentityProviderConfig`` message.
                         A valid update mask must:

                         1. contain at least one update path,
                         2. contain only valid update paths.

                         Fields that can be updated are marked as ``Modifiable``.
                         For additional information see the documentation for standard protobuf3's ``google.protobuf.FieldMask``.

                         Required
                    format: field-mask
        UpdateIdentityProviderConfigResponse:
            type: object
            properties:
                identityProviderConfig:
                    allOf:
                        - $ref: '#/components/schemas/IdentityProviderConfig'
                    description: |-
                        Updated identity provider config

                         Required
        UpdatePartyDetailsRequest:
            type: object
            properties:
                partyDetails:
                    allOf:
                        - $ref: '#/components/schemas/PartyDetails'
                    description: |-
                        Party to be updated
                         Modifiable

                         Required
                updateMask:
                    type: string
                    description: |-
                        An update mask specifies how and which properties of the ``PartyDetails`` message are to be updated.
                         An update mask consists of a set of update paths.
                         A valid update path points to a field or a subfield relative to the ``PartyDetails`` message.
                         A valid update mask must:

                         1. contain at least one update path,
                         2. contain only valid update paths.

                         Fields that can be updated are marked as ``Modifiable``.
                         An update path can also point to non-``Modifiable`` fields such as 'party' and 'local_metadata.resource_version'
                         because they are used:

                         1. to identify the party details resource subject to the update,
                         2. for concurrent change control.

                         An update path can also point to non-``Modifiable`` fields such as 'is_local'
                         as long as the values provided in the update request match the server values.
                         Examples of update paths: 'local_metadata.annotations', 'local_metadata'.
                         For additional information see the documentation for standard protobuf3's ``google.protobuf.FieldMask``.
                         For similar Ledger API see ``com.daml.ledger.api.v2.admin.UpdateUserRequest``.

                         Required
                    format: field-mask
            description: 'Required authorization: ``HasRight(ParticipantAdmin) OR IsAuthenticatedIdentityProviderAdmin(party_details.identity_provider_id)``'
        UpdatePartyDetailsResponse:
            type: object
            properties:
                partyDetails:
                    allOf:
                        - $ref: '#/components/schemas/PartyDetails'
                    description: |-
                        Updated party details

                         Required
        UpdateUserIdentityProviderIdRequest:
            type: object
            properties:
                userId:
                    type: string
                    description: |-
                        User to update

                         Required
                sourceIdentityProviderId:
                    type: string
                    description: |-
                        Current identity provider ID of the user
                         If omitted, the default IDP is assumed

                         Optional
                targetIdentityProviderId:
                    type: string
                    description: |-
                        Target identity provider ID of the user
                         If omitted, the default IDP is assumed

                         Optional
            description: 'Required authorization: ``HasRight(ParticipantAdmin)``'
        UpdateUserIdentityProviderIdResponse:
            type: object
            properties: {}
        UpdateUserRequest:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: |-
                        The user to update.
                         Modifiable

                         Required
                updateMask:
                    type: string
                    description: |-
                        An update mask specifies how and which properties of the ``User`` message are to be updated.
                         An update mask consists of a set of update paths.
                         A valid update path points to a field or a subfield relative to the ``User`` message.
                         A valid update mask must:

                         1. contain at least one update path,
                         2. contain only valid update paths.

                         Fields that can be updated are marked as ``Modifiable``.
                         An update path can also point to a non-``Modifiable`` fields such as 'id' and 'metadata.resource_version'
                         because they are used:

                         1. to identify the user resource subject to the update,
                         2. for concurrent change control.

                         Examples of valid update paths: 'primary_party', 'metadata', 'metadata.annotations'.
                         For additional information see the documentation for standard protobuf3's ``google.protobuf.FieldMask``.
                         For similar Ledger API see ``com.daml.ledger.api.v2.admin.UpdatePartyDetailsRequest``.

                         Required
                    format: field-mask
            description: 'Required authorization: ``HasRight(ParticipantAdmin) OR IsAuthenticatedIdentityProviderAdmin(user.identity_provider_id)``'
        UpdateUserResponse:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: |-
                        Updated user

                         Required
        UpdateVettedPackagesRequest:
            type: object
            properties:
                changes:
                    type: array
                    items:
                        $ref: '#/components/schemas/VettedPackagesChange'
                    description: |-
                        Changes to apply to the current vetting state of the participant on the
                         specified synchronizer. The changes are applied in order.
                         Any package not changed will keep their previous vetting state.

                         Required: must be non-empty
                dryRun:
                    type: boolean
                    description: |-
                        If dry_run is true, then the changes are only prepared, but not applied. If
                         a request would trigger an error when run (e.g. TOPOLOGY_DEPENDENCIES_NOT_VETTED),
                         it will also trigger an error when dry_run.

                         Use this flag to preview a change before applying it.
                         Defaults to false.

                         Optional
                synchronizerId:
                    type: string
                    description: |-
                        If set, the requested changes will take place on the specified
                         synchronizer. If synchronizer_id is unset and the participant is only
                         connected to a single synchronizer, that synchronizer will be used by
                         default. If synchronizer_id is unset and the participant is connected to
                         multiple synchronizers, the request will error out with
                         PACKAGE_SERVICE_CANNOT_AUTODETECT_SYNCHRONIZER.

                         Optional
                expectedTopologySerial:
                    allOf:
                        - $ref: '#/components/schemas/PriorTopologySerial'
                    description: |-
                        The serial of the last ``VettedPackages`` topology transaction of this
                         participant and on this synchronizer.

                         Execution of the request fails if this is not correct. Use this to guard
                         against concurrent changes.

                         If left unspecified, no validation is done against the last transaction's
                         serial.

                         Optional
                updateVettedPackagesForceFlags:
                    type: array
                    items:
                        enum:
                            - UPDATE_VETTED_PACKAGES_FORCE_FLAG_UNSPECIFIED
                            - UPDATE_VETTED_PACKAGES_FORCE_FLAG_ALLOW_VET_INCOMPATIBLE_UPGRADES
                            - UPDATE_VETTED_PACKAGES_FORCE_FLAG_ALLOW_UNVETTED_DEPENDENCIES
                        type: string
                        format: enum
                    description: |-
                        Controls whether potentially unsafe vetting updates are allowed.

                         Optional: can be empty
        UpdateVettedPackagesResponse:
            type: object
            properties:
                pastVettedPackages:
                    allOf:
                        - $ref: '#/components/schemas/VettedPackages'
                    description: |-
                        All vetted packages on this participant and synchronizer, before the
                         specified changes. Empty if no vetting state existed beforehand.

                         Not populated if no vetted topology state exists prior to the update.

                         Optional
                newVettedPackages:
                    allOf:
                        - $ref: '#/components/schemas/VettedPackages'
                    description: |-
                        All vetted packages on this participant and synchronizer, after the specified changes.

                         Required
        UploadDarFileRequest:
            type: object
            properties:
                darFile:
                    type: string
                    description: |-
                        Contains a Daml archive DAR file, which in turn is a jar like zipped
                         container for ``daml_lf`` archives. See further details in
                         ``daml_lf.proto``.

                         Required: must be non-empty
                    format: bytes
                submissionId:
                    type: string
                    description: |-
                        Unique submission identifier.
                         If not populated, a random identifier will be generated.

                         Optional
                vettingChange:
                    enum:
                        - VETTING_CHANGE_UNSPECIFIED
                        - VETTING_CHANGE_VET_ALL_PACKAGES
                        - VETTING_CHANGE_DONT_VET_ANY_PACKAGES
                    type: string
                    description: |-
                        How to vet packages in the DAR being uploaded

                         Optional
                    format: enum
                synchronizerId:
                    type: string
                    description: |-
                        Only used if VettingChange is set to VETTING_CHANGE_VET_ALL_PACKAGES, in
                         order to specify which synchronizer to vet on.

                         If synchronizer_id is set, the synchronizer with this ID will be used. If
                         synchronizer_id is unset and the participant is only connected to a single
                         synchronizer, that synchronizer will be used by default. If synchronizer_id
                         is unset and the participant is connected to multiple synchronizers, the
                         request will error out with PACKAGE_SERVICE_CANNOT_AUTODETECT_SYNCHRONIZER.

                         Optional
        UploadDarFileResponse:
            type: object
            properties: {}
            description: A message that is received when the upload operation succeeded.
        User:
            type: object
            properties:
                id:
                    type: string
                    description: |-
                        The user identifier, which must be a non-empty string of at most 128
                         characters that are either alphanumeric ASCII characters or one of the symbols "@^$.!`-#+'~_|:()".

                         Required
                primaryParty:
                    type: string
                    description: |-
                        The primary party as which this user reads and acts by default on the ledger
                         *provided* it has the corresponding ``CanReadAs(primary_party)`` or
                         ``CanActAs(primary_party)`` rights.
                         Ledger API clients SHOULD set this field to a non-empty value for all users to
                         enable the users to act on the ledger using their own Daml party.
                         Users for participant administrators MAY have an associated primary party.
                         Modifiable

                         Optional
                isDeactivated:
                    type: boolean
                    description: |-
                        When set, then the user is denied all access to the Ledger API.
                         Otherwise, the user has access to the Ledger API as per the user's rights.
                         Modifiable

                         Optional
                metadata:
                    allOf:
                        - $ref: '#/components/schemas/ObjectMeta'
                    description: |-
                        The metadata of this user.
                         Note that the ``metadata.resource_version`` tracks changes to the properties described by the ``User`` message and not the user's rights.
                         Modifiable

                         Optional
                identityProviderId:
                    type: string
                    description: |-
                        The ID of the identity provider configured by ``Identity Provider Config``
                         If not set, assume the user is managed by the default identity provider.

                         Optional
                primaryPartyAuthentication:
                    type: boolean
                    description: |-
                        If set to true, the user may authenticate against the Ledger API by signing
                         a Party JWT using the primary party's signing key.
                         Modifiable

                         Optional
            description: |-
                Users are used to dynamically manage the rights given to Daml applications.
                 They are stored and managed per participant node.
        UserManagementFeature:
            type: object
            properties:
                supported:
                    type: boolean
                    description: |-
                        Whether the Ledger API server provides the user management service.

                         Required
                maxRightsPerUser:
                    type: integer
                    description: |-
                        The maximum number of rights that can be assigned to a single user.
                         Servers MUST support at least 100 rights per user.
                         A value of 0 means that the server enforces no rights per user limit.

                         Required
                    format: int32
                maxUsersPageSize:
                    type: integer
                    description: |-
                        The maximum number of users the server can return in a single response (page).
                         Servers MUST support at least a 100 users per page.
                         A value of 0 means that the server enforces no page size limit.

                         Required
                    format: int32
        ValidateDarFileRequest:
            type: object
            properties:
                darFile:
                    type: string
                    description: |-
                        Contains a Daml archive DAR file, which in turn is a jar like zipped
                         container for ``daml_lf`` archives. See further details in
                         ``daml_lf.proto``.

                         Required: must be non-empty
                    format: bytes
                submissionId:
                    type: string
                    description: |-
                        Unique submission identifier. If not defined, defaults to a random identifier.

                         Optional
                synchronizerId:
                    type: string
                    description: |-
                        If synchronizer_id is set, the synchronizer with this ID will be used. If
                         synchronizer_id is unset and the participant is only connected to a single
                         synchronizer, that synchronizer will be used by default. If synchronizer_id
                         is unset and the participant is connected to multiple synchronizers, the
                         request will error out with PACKAGE_SERVICE_CANNOT_AUTODETECT_SYNCHRONIZER.

                         Optional
            description: |-
                Performs the same checks that UploadDarFileRequest would perform, but doesn't
                 upload the DAR.
        ValidateDarFileResponse:
            type: object
            properties: {}
        Value:
            type: object
            properties:
                bool:
                    type: boolean
                    description: True or false.
                int64:
                    type: string
                date:
                    type: integer
                    description: |-
                        Days since the unix epoch. Can go backwards. Limited from
                         0001-01-01 to 9999-12-31, also to be compatible with
                         https://www.ietf.org/rfc/rfc3339.txt
                    format: int32
                timestamp:
                    type: string
                    description: |-
                        Microseconds since the UNIX epoch. Can go backwards. Fixed
                         since the vast majority of values will be greater than
                         2^28, since currently the number of microseconds since the
                         epoch is greater than that. Range: 0001-01-01T00:00:00Z to
                         9999-12-31T23:59:59.999999Z, so that we can convert to/from
                         https://www.ietf.org/rfc/rfc3339.txt
                numeric:
                    type: string
                    description: |-
                        A Numeric, that is a decimal value with precision 38 (at most 38 significant digits) and a
                         scale between 0 and 37 (significant digits on the right of the decimal point).
                         The field has to match the regex

                         .. code-block:: none

                           [+-]?\d{1,38}(.\d{0,37})?

                         and should be representable by a Numeric without loss of precision.
                party:
                    type: string
                    description: |-
                        An agent operating on the ledger.
                         Must be a valid PartyIdString.
                text:
                    type: string
                    description: A string.
                contractId:
                    type: string
                    description: |-
                        Identifier of an on-ledger contract. Commands which reference an unknown or already archived contract ID will fail.
                         Must be a valid LedgerString.
                optional:
                    allOf:
                        - $ref: '#/components/schemas/Optional'
                    description: The Optional type, None or Some
                list:
                    allOf:
                        - $ref: '#/components/schemas/List'
                    description: Represents a homogeneous list of values.
                textMap:
                    allOf:
                        - $ref: '#/components/schemas/TextMap'
                    description: The TextMap type
                genMap:
                    allOf:
                        - $ref: '#/components/schemas/GenMap'
                    description: The GenMap type
                record:
                    $ref: '#/components/schemas/Record'
                variant:
                    $ref: '#/components/schemas/Variant'
                enum:
                    allOf:
                        - $ref: '#/components/schemas/Enum'
                    description: The Enum type
            description: |-
                Encodes values that the ledger accepts as command arguments and emits as contract arguments.

                 The values encoding use different classes of non-empty strings as identifiers. Those classes are
                 defined as follows:

                 - NameStrings are strings with length <= 1000 that match the regexp ``[A-Za-z\$_][A-Za-z0-9\$_]*``.
                 - PackageIdStrings are strings with length <= 64 that match the regexp ``[A-Za-z0-9\-_ ]+``.
                 - PartyIdStrings are strings with length <= 255 that match the regexp ``[A-Za-z0-9:\-_ ]+``.
                 - LedgerStrings are strings with length <= 255 that match the regexp ``[A-Za-z0-9#:\-_/ ]+``.
                 - UserIdStrings are strings with length <= 128 that match the regexp ``[a-zA-Z0-9@^$.!`\-#+'~_|:]+``.
        Variant:
            type: object
            properties:
                variantId:
                    allOf:
                        - $ref: '#/components/schemas/Identifier'
                    description: |-
                        Omitted from the transaction stream when verbose streaming is not enabled.
                         Optional when submitting commands.
                constructor:
                    type: string
                    description: |-
                        Determines which of the Variant's alternatives is encoded in this message.
                         Must be a valid NameString.
                         Required
                value:
                    allOf:
                        - $ref: '#/components/schemas/Value'
                    description: |-
                        The value encoded within the Variant.
                         Required
            description: A value with alternative representations.
        VettedPackage:
            type: object
            properties:
                packageId:
                    type: string
                    description: |-
                        Package ID of this package

                         Required
                validFromInclusive:
                    type: string
                    description: |-
                        The time from which this package is vetted. Empty if vetting time has no
                         lower bound.

                         Optional
                    format: date-time
                validUntilExclusive:
                    type: string
                    description: |-
                        The time until which this package is vetted. Empty if vetting time has no
                         upper bound.

                         Optional
                    format: date-time
                packageName:
                    type: string
                    description: |-
                        Name of this package.
                         Only available if the package has been uploaded to the current participant.

                         Optional
                packageVersion:
                    type: string
                    description: |-
                        Version of this package.
                         Only available if the package has been uploaded to the current participant.

                         Optional
            description: |-
                A package that is vetting on a given participant and synchronizer,
                 modelled after ``VettedPackage`` in `topology.proto <https://github.com/digital-asset/canton/blob/main/community/base/src/main/protobuf/com/digitalasset/canton/protocol/v30/topology.proto#L206>`_,
                 enriched with the package name and version.
        VettedPackages:
            type: object
            properties:
                packages:
                    type: array
                    items:
                        $ref: '#/components/schemas/VettedPackage'
                    description: |-
                        Sorted by package_name and package_version where known, and package_id as a
                         last resort.

                         Required: must be non-empty
                participantId:
                    type: string
                    description: |-
                        Participant on which these packages are vetted.

                         Required
                synchronizerId:
                    type: string
                    description: |-
                        Synchronizer on which these packages are vetted.

                         Required
                topologySerial:
                    type: integer
                    description: |-
                        Serial of last ``VettedPackages`` topology transaction of this participant
                         and on this synchronizer.

                         Required
                    format: uint32
            description: |-
                The list of packages vetted on a given participant and synchronizer, modelled
                 after ``VettedPackages`` in `topology.proto <https://github.com/digital-asset/canton/blob/main/community/base/src/main/protobuf/com/digitalasset/canton/protocol/v30/topology.proto#L206>`_.
                 The list only contains packages that matched a filter in the query that
                 originated it.
        VettedPackagesChange:
            type: object
            properties:
                operation:
                    allOf:
                        - $ref: '#/components/schemas/VettedPackagesChangeOperation'
                    description: Required
            description: A change to the set of vetted packages.
        VettedPackagesChangeOperation:
            type: object
            properties:
                Vet:
                    allOf:
                        - $ref: '#/components/schemas/VettedPackagesChange_Vet'
                    description: Add packages to or update packages in the set of vetted packages.
                Unvet:
                    allOf:
                        - $ref: '#/components/schemas/VettedPackagesChange_Unvet'
                    description: Remove packages from the set of vetted packages.
            description: Selects which change a ``VettedPackagesChange`` applies to the set of vetted packages.
        VettedPackagesChange_Unvet:
            type: object
            properties:
                packages:
                    type: array
                    items:
                        $ref: '#/components/schemas/VettedPackagesRef'
                    description: |-
                        Packages to be unvetted.

                         If a reference in this list matches multiple packages, they are all
                         unvetted.

                         Required: must be non-empty
            description: Remove packages from the set of vetted packages
        VettedPackagesChange_Vet:
            type: object
            properties:
                packages:
                    type: array
                    items:
                        $ref: '#/components/schemas/VettedPackagesRef'
                    description: |-
                        Packages to be vetted.

                         If a reference in this list matches more than one package, the change is
                         considered ambiguous and the entire update request is rejected. In other
                         words, every reference must match exactly one package.

                         Required: must be non-empty
                newValidFromInclusive:
                    type: string
                    description: |-
                        The time from which these packages should be vetted, prior lower bounds
                         are overwritten.
                         Optional
                    format: date-time
                newValidUntilExclusive:
                    type: string
                    description: |-
                        The time until which these packages should be vetted, prior upper bounds
                         are overwritten.
                         Optional
                    format: date-time
            description: |-
                Set vetting bounds of a list of packages. Packages that were not previously
                 vetted have their bounds added, previous vetting bounds are overwritten.
        VettedPackagesRef:
            type: object
            properties:
                packageId:
                    type: string
                    description: |-
                        Package's package id must be the same as this field.

                         Optional
                packageName:
                    type: string
                    description: |-
                        Package's name must be the same as this field.

                         Optional
                packageVersion:
                    type: string
                    description: |-
                        Package's version must be the same as this field.

                         Optional
            description: |-
                A reference to identify one or more packages.

                 A reference matches a package if its ``package_id`` matches the package's ID,
                 its ``package_name`` matches the package's name, and its ``package_version``
                 matches the package's version. If an attribute in the reference is left
                 unspecified (i.e. as an empty string), that attribute is treated as a
                 wildcard. At a minimum, ``package_id`` or the ``package_name`` must be
                 specified.

                 If a reference does not match any package, the reference is considered
                 unresolved and the entire update request is rejected.
        WildcardFilter:
            type: object
            properties:
                includeCreatedEventBlob:
                    type: boolean
                    description: |-
                        Whether to include a ``created_event_blob`` in the returned ``CreatedEvent``.
                         Use this to access the contract create event payload in your API client
                         for submitting it as a disclosed contract with future commands.

                         Optional
            description: This filter matches all templates.
tags:
    - name: CommandCompletionService
      description: |-
        Allows clients to observe the status of their submissions.
         Commands may be submitted via the Command Submission Service.
         The on-ledger effects of their submissions are disclosed by the Update Service.

         Commands may fail in 2 distinct manners:

         1. Failure communicated synchronously in the gRPC error of the submission.
         2. Failure communicated asynchronously in a Completion, see ``completion.proto``.

         Note that not only successfully submitted commands MAY produce a completion event. For example, the participant MAY
         choose to produce a completion event for a rejection of a duplicate command.

         Clients that do not receive a successful completion about their submission MUST NOT assume that it was successful.
         Clients SHOULD subscribe to the CompletionStream before starting to submit commands to prevent race conditions.
    - name: CommandService
      description: |-
        Command Service is able to correlate submitted commands with completion data, identify timeouts, and return contextual
         information with each tracking result. This supports the implementation of stateless clients.

         Note that submitted commands generally produce completion events as well, even in case a command gets rejected.
         For example, the participant SHOULD produce a completion event for a rejection of a duplicate command.
    - name: CommandSubmissionService
      description: |-
        Allows clients to attempt advancing the ledger's state by submitting commands.
         The final states of their submissions are disclosed by the Command Completion Service.
         The on-ledger effects of their submissions are disclosed by the Update Service.

         Commands may fail in 2 distinct manners:

         1. Failure communicated synchronously in the gRPC error of the submission.
         2. Failure communicated asynchronously in a Completion, see ``completion.proto``.

         Note that not only successfully submitted commands MAY produce a completion event. For example, the participant MAY
         choose to produce a completion event for a rejection of a duplicate command.

         Clients that do not receive a successful completion about their submission MUST NOT assume that it was successful.
         Clients SHOULD subscribe to the CompletionStream before starting to submit commands to prevent race conditions.
    - name: ContractService
      description: This service is experimental / alpha, therefore no backwards compatibility is guaranteed.
    - name: EventQueryService
      description: |-
        Query events by contract id.

         Note that querying by contract key is not (yet) supported, as contract keys
         are not supported (yet) in multi-synchronizer scenarios.
    - name: IdentityProviderConfigService
      description: |-
        Identity Provider Config Service makes it possible for participant node administrators
         to setup and manage additional identity providers at runtime.

         This allows using access tokens from identity providers unknown at deployment time. When an identity
         provider is configured, independent IDP administrators can manage their own set of parties and users.
         Such parties and users have a matching `identity_provider_id` defined and are inaccessible to
         administrators from other identity providers. A user will only be authenticated if the corresponding JWT
         token is issued by the appropriate identity provider.
         Users and parties without `identity_provider_id` defined are assumed to be using the default identity provider,
         which is configured statically at the participant node's deployment time.

         The Ledger API uses the "iss" claim of a JWT token to match the token to a specific IDP. If there is no match,
         the default IDP is assumed.

         The fields of request messages (and sub-messages) are marked either as ``Optional`` or ``Required``:

         1. ``Optional`` denoting the client may leave the field unset when sending a request.
         2. ``Required`` denoting the client must set the field to a non-default value when sending a request.

         An identity provider config resource is described by the ``IdentityProviderConfig`` message,
         An identity provider config resource, once it has been created, can be modified.
         In order to update the properties represented by the ``IdentityProviderConfig`` message use the ``UpdateIdentityProviderConfig`` RPC.
         The only fields that can be modified are those marked as ``Modifiable``.
    - name: InteractiveSubmissionService
      description: |-
        Service allowing interactive construction of command submissions

         The prepare and execute endpoints allow to submit commands in 2-steps:

         1. prepare transaction from commands,
         2. submit the prepared transaction

         This gives callers the ability to sign the daml transaction with their own signing keys
    - name: PackageManagementService
      description: |-
        Status: experimental interface, will change before it is deemed production
         ready

         Query the Daml-LF packages supported by the ledger participant and upload
         DAR files. We use 'backing participant' to refer to this specific participant
         in the methods of this API.
    - name: PackageService
      description: Allows clients to query the Daml-LF packages that are supported by the server.
    - name: PartyManagementService
      description: |-
        This service allows inspecting the party management state of the ledger known to the participant
         and managing the participant-local party metadata.

         The authorization rules for its RPCs are specified on the ``<RpcName>Request``
         messages as boolean expressions over these facts:

         1. ``HasRight(r)`` denoting whether the authenticated user has right ``r`` and
         2. ``IsAuthenticatedIdentityProviderAdmin(idp)`` denoting whether ``idp`` is equal to the ``identity_provider_id``
            of the authenticated user and the user has an IdentityProviderAdmin right.

         If `identity_provider_id` is set to an empty string, then it's effectively set to the value of access token's 'iss' field if that is provided.
         If `identity_provider_id` remains an empty string, the default identity provider will be assumed.

         The fields of request messages (and sub-messages) are marked either as ``Optional`` or ``Required``:

         1. ``Optional`` denoting the client may leave the field unset when sending a request.
         2. ``Required`` denoting the client must set the field to a non-default value when sending a request.

         A party details resource is described by the ``PartyDetails`` message,
         A party details resource, once it has been created, can be modified using the ``UpdatePartyDetails`` RPC.
         The only fields that can be modified are those marked as ``Modifiable``.
    - name: StateService
      description: Allows clients to get state from the ledger.
    - name: UpdateService
      description: |-
        Allows clients to read updates (transactions, (un)assignments, topology events) from the ledger.

         ``GetUpdates`` provides a comprehensive stream of updates/changes
         which happened on the virtual shared ledger. These streams are indexed with ledger
         offsets, which are strictly increasing.
         The virtual shared ledger consist of changes happening on multiple synchronizers which are
         connected to the serving participant. Each update belongs to one synchronizer, this is
         provided in the result (the ``synchronizer_id`` field in ``Transaction``
         for transactions, the ``source`` field in ``UnassignedEvent`` and the ``target`` field in ``AssignedEvent``).
         Consumers can rely on strong causal guarantees on the virtual shared ledger for a single
         synchronizer: updates which have greater offsets are happened after than updates with smaller
         offsets for the same synchronizer. Across different synchronizers this is not guaranteed.
    - name: UserManagementService
      description: |-
        Service to manage users and their rights for interacting with the Ledger API
         served by a participant node.

         The authorization rules for its RPCs are specified on the ``<RpcName>Request``
         messages as boolean expressions over these facts:

         1. ``HasRight(r)`` denoting whether the authenticated user has right ``r`` and
         2. ``IsAuthenticatedUser(uid)`` denoting whether ``uid`` is the empty string or equal to the id of the authenticated user.
         3. ``IsAuthenticatedIdentityProviderAdmin(idp)`` denoting whether ``idp`` is equal to the ``identity_provider_id``
            of the authenticated user and the user has an IdentityProviderAdmin right.

         If `user_id` is set to the empty string (the default), then the data for the authenticated user will be retrieved.
         If `identity_provider_id` is set to an empty string, then it's effectively set to the value of access token's 'iss' field if that is provided.
         If `identity_provider_id` remains an empty string, the default identity provider will be assumed.

         The fields of request messages (and sub-messages) are marked either as ``Optional`` or ``Required``:

         1. ``Optional`` denoting the client may leave the field unset when sending a request.
         2. ``Required`` denoting the client must set the field to a non-default value when sending a request.

         A user resource consists of:

         1. a set of properties represented by the ``User`` message,
         2. a set of user rights, where each right is represented by the ``Right`` message.

         A user resource, once it has been created, can be modified.
         In order to update the properties represented by the ``User`` message use the ``UpdateUser`` RPC. The only fields that can be modified are those marked as ``Modifiable``.
         In order to grant or revoke user rights use ``GrantRights' and ``RevokeRights`` RPCs.
    - name: VersionService
      description: Allows clients to retrieve information about the ledger API version

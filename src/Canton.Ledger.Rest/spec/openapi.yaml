        Exercise:
            type: object
            properties:
                lf_version:
                    type: string
                    description: Specific LF version of the node
                contract_id:
                    type: string
                package_name:
                    type: string
                template_id:
                    allOf:
                        - $ref: '#/components/schemas/Identifier'
                    description: The identifier uses the package-id reference format.
                signatories:
                    type: array
                    items:
                        type: string
                stakeholders:
                    type: array
                    items:
                        type: string
                acting_parties:
                    type: array
                    items:
                        type: string
                interface_id:
                    allOf:
                        - $ref: '#/components/schemas/Identifier'
                    description: The identifier uses the package-id reference format.
                choice_id:
                    type: string
                chosen_value:
                    $ref: '#/components/schemas/Value'
                consuming:
                    type: boolean
                children:
                    type: array
                    items:
                        type: string
                exercise_result:
                    $ref: '#/components/schemas/Value'
                choice_observers:
                    type: array
                    items:
                        type: string
            description: Exercise node
        ExerciseByKeyCommand:
            type: object
            properties:
                template_id:
                    allOf:
                        - $ref: '#/components/schemas/Identifier'
                    description: |-
                        The template of contract the client wants to exercise.
                         Both package-name and package-id reference identifier formats for the template-id are supported.
                         Note: The package-id reference identifier format is deprecated. We plan to end support for this format in version 3.4.

                         Required
                contract_key:
                    allOf:
                        - $ref: '#/components/schemas/Value'
                    description: |-
                        The key of the contract the client wants to exercise upon.
                         Required
                choice:
                    type: string
                    description: |-
                        The name of the choice the client wants to exercise.
                         Must be a valid NameString (as described in ``value.proto``)
                         Required
                choice_argument:
                    allOf:
                        - $ref: '#/components/schemas/Value'
                    description: |-
                        The argument for this choice.
                         Required
            description: Exercise a choice on an existing contract specified by its key.
        ExerciseCommand:
            type: object
            properties:
                template_id:
                    allOf:
                        - $ref: '#/components/schemas/Identifier'
                    description: |-
                        The template or interface of the contract the client wants to exercise.
                         Both package-name and package-id reference identifier formats for the template-id are supported.
                         Note: The package-id reference identifier format is deprecated. We plan to end support for this format in version 3.4.
                         To exercise a choice on an interface, specify the interface identifier in the template_id field.

                         Required
                contract_id:
                    type: string
                    description: |-
                        The ID of the contract the client wants to exercise upon.
                         Must be a valid LedgerString (as described in ``value.proto``).
                         Required
                choice:
                    type: string
                    description: |-
                        The name of the choice the client wants to exercise.
                         Must be a valid NameString (as described in ``value.proto``)
                         Required
                choice_argument:
                    allOf:
                        - $ref: '#/components/schemas/Value'
                    description: |-
                        The argument for this choice.
                         Required
            description: Exercise a choice on an existing contract.
        ExercisedEvent:
            type: object
            properties:
                offset:
                    type: string
                    description: |-
                        The offset of origin.
                         Offsets are managed by the participant nodes.
                         Transactions can thus NOT be assumed to have the same offsets on different participant nodes.
                         Required, it is a valid absolute offset (positive integer)
                node_id:
                    type: integer
                    description: |-
                        The position of this event in the originating transaction or reassignment.
                         Node IDs are not necessarily equal across participants,
                         as these may see different projections/parts of transactions.
                         Required, must be valid node ID (non-negative integer)
                    format: int32
                contract_id:
                    type: string
                    description: |-
                        The ID of the target contract.
                         Must be a valid LedgerString (as described in ``value.proto``).
                         Required
                template_id:
                    allOf:
                        - $ref: '#/components/schemas/Identifier'
                    description: |-
                        Identifies the template that defines the executed choice.
                         This template's package-id may differ from the target contract's package-id
                         if the target contract has been upgraded or downgraded.

                         The identifier uses the package-id reference format.

                         Required
                interface_id:
                    allOf:
                        - $ref: '#/components/schemas/Identifier'
                    description: |-
                        The interface where the choice is defined, if inherited.
                         If defined, the identifier uses the package-id reference format.

                         Optional
                choice:
                    type: string
                    description: |-
                        The choice that was exercised on the target contract.
                         Must be a valid NameString (as described in ``value.proto``).
                         Required
                choice_argument:
                    allOf:
                        - $ref: '#/components/schemas/Value'
                    description: |-
                        The argument of the exercised choice.
                         Required
                acting_parties:
                    type: array
                    items:
                        type: string
                    description: |-
                        The parties that exercised the choice.
                         Each element must be a valid PartyIdString (as described in ``value.proto``).
                         Required
                consuming:
                    type: boolean
                    description: |-
                        If true, the target contract may no longer be exercised.
                         Required
                witness_parties:
                    type: array
                    items:
                        type: string
                    description: |-
                        The parties that are notified of this event. The witnesses of an exercise
                         node will depend on whether the exercise was consuming or not.
                         If consuming, the witnesses are the union of the stakeholders,
                         the actors and all informees of all the ancestors of this event this
                         participant knows about.
                         If not consuming, the witnesses are the union of the signatories,
                         the actors and all informees of all the ancestors of this event this
                         participant knows about.
                         In both cases the witnesses are limited to the querying parties, or not
                         limited in case anyParty filters are used.
                         Note that the actors might not necessarily be observers
                         and thus stakeholders. This is the case when the controllers of a
                         choice are specified using "flexible controllers", using the
                         ``choice ... controller`` syntax, and said controllers are not
                         explicitly marked as observers.
                         Each element must be a valid PartyIdString (as described in ``value.proto``).
                         Required
                last_descendant_node_id:
                    type: integer
                    description: |-
                        Specifies the upper boundary of the node ids of the events in the same transaction that appeared as a result of
                         this ``ExercisedEvent``. This allows unambiguous identification of all the members of the subtree rooted at this
                         node. A full subtree can be constructed when all descendant nodes are present in the stream. If nodes are heavily
                         filtered, it is only possible to determine if a node is in a consequent subtree or not.
                         Required
                    format: int32
                exercise_result:
                    allOf:
                        - $ref: '#/components/schemas/Value'
                    description: |-
                        The result of exercising the choice.
                         Required
                package_name:
                    type: string
                    description: |-
                        The package name of the contract.
                         Required
                implemented_interfaces:
                    type: array
                    items:
                        $ref: '#/components/schemas/Identifier'
                    description: |-
                        If the event is consuming, the interfaces implemented by the target template that have been
                         matched from the interface filter query.
                         Populated only in case interface filters with include_interface_view set.

                         The identifier uses the package-id reference format.

                         Optional
                acs_delta:
                    type: boolean
                    description: |-
                        Whether this event would be part of respective ACS_DELTA shaped stream,
                         and should therefore considered when tracking contract activeness on the client-side.
                         Required
            description: Records that a choice has been exercised on a target contract.
        ExperimentalCommandInspectionService:
            type: object
            properties:
                supported:
                    type: boolean
            description: Whether the Ledger API supports command inspection service
        ExperimentalFeatures:
            type: object
            properties:
                static_time:
                    $ref: '#/components/schemas/ExperimentalStaticTime'
                command_inspection_service:
                    $ref: '#/components/schemas/ExperimentalCommandInspectionService'
            description: See the feature message definitions for descriptions.
        ExperimentalStaticTime:
            type: object
            properties:
                supported:
                    type: boolean
            description: Ledger is in the static time mode and exposes a time service.
        FeaturesDescriptor:
            type: object
            properties:
                experimental:
                    allOf:
                        - $ref: '#/components/schemas/ExperimentalFeatures'
                    description: |-
                        Features under development or features that are used
                         for ledger implementation testing purposes only.

                         Daml applications SHOULD not depend on these in production.
                user_management:
                    allOf:
                        - $ref: '#/components/schemas/UserManagementFeature'
                    description: |-
                        If set, then the Ledger API server supports user management.
                         It is recommended that clients query this field to gracefully adjust their behavior for
                         ledgers that do not support user management.
                party_management:
                    allOf:
                        - $ref: '#/components/schemas/PartyManagementFeature'
                    description: |-
                        If set, then the Ledger API server supports party management configurability.
                         It is recommended that clients query this field to gracefully adjust their behavior to
                         maximum party page size.
                offset_checkpoint:
                    allOf:
                        - $ref: '#/components/schemas/OffsetCheckpointFeature'
                    description: It contains the timeouts related to the periodic offset checkpoint emission
                package_feature:
                    allOf:
                        - $ref: '#/components/schemas/PackageFeature'
                    description: |-
                        If set, then the Ledger API server supports package listing
                         configurability. It is recommended that clients query this field to
                         gracefully adjust their behavior to maximum package listing page size.
        Fetch:
            type: object
            properties:
                lf_version:
                    type: string
                    description: Specific LF version of the node
                contract_id:
                    type: string
                package_name:
                    type: string
                template_id:
                    allOf:
                        - $ref: '#/components/schemas/Identifier'
                    description: The identifier uses the package-id reference format.
                signatories:
                    type: array
                    items:
                        type: string
                stakeholders:
                    type: array
                    items:
                        type: string
                acting_parties:
                    type: array
                    items:
                        type: string
                interface_id:
                    allOf:
                        - $ref: '#/components/schemas/Identifier'
                    description: Optional
            description: Fetch node
        Filters:
            type: object
            properties:
                cumulative:
                    type: array
                    items:
                        $ref: '#/components/schemas/CumulativeFilter'
                    description: |-
                        Every filter in the cumulative list expands the scope of the resulting stream. Each interface,
                         template or wildcard filter means additional events that will match the query.
                         The impact of include_interface_view and include_created_event_blob fields in the filters will
                         also be accumulated.
                         A template or an interface SHOULD NOT appear twice in the accumulative field.
                         A wildcard filter SHOULD NOT be defined more than once in the accumulative field.
                         Optional, if no ``CumulativeFilter`` defined, the default of a single ``WildcardFilter`` with
                         include_created_event_blob unset is used.
            description: The union of a set of template filters, interface filters, or a wildcard.
        GenMap:
            type: object
            properties:
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/GenMap_Entry'
        GenMap_Entry:
            type: object
            properties:
                key:
                    $ref: '#/components/schemas/Value'
                value:
                    $ref: '#/components/schemas/Value'
        GenerateExternalPartyTopologyRequest:
            type: object
            properties:
                synchronizer:
                    type: string
                    description: |-
                        TODO(#27670) support synchronizer aliases
                         Required: synchronizer-id for which we are building this request.
                party_hint:
                    type: string
                    description: 'Required: the actual party id will be constructed from this hint and a fingerprint of the public key'
                public_key:
                    allOf:
                        - $ref: '#/components/schemas/SigningPublicKey'
                    description: 'Required: public key'
                local_participant_observation_only:
                    type: boolean
                    description: 'Optional: if true, then the local participant will only be observing, not confirming. Default false.'
                other_confirming_participant_uids:
                    type: array
                    items:
                        type: string
                    description: 'Optional: other participant ids which should be confirming for this party'
                confirmation_threshold:
                    type: integer
                    description: 'Optional: Confirmation threshold >= 1 for the party. Defaults to all available confirmers (or if set to 0).'
                    format: uint32
                observing_participant_uids:
                    type: array
                    items:
                        type: string
                    description: 'Optional: other observing participant ids for this party'
        GenerateExternalPartyTopologyResponse:
            type: object
            properties:
                party_id:
                    type: string
                    description: the generated party id
                public_key_fingerprint:
                    type: string
                    description: the fingerprint of the supplied public key
                topology_transactions:
                    type: array
                    items:
                        type: string
                        format: bytes
                    description: |-
                        The serialized topology transactions which need to be signed and submitted as part of the allocate party process
                         Note that the serialization includes the versioning information. Therefore, the transaction here is serialized
                         as an `UntypedVersionedMessage` which in turn contains the serialized `TopologyTransaction` in the version
                         supported by the synchronizer.
                multi_hash:
                    type: string
                    description: the multi-hash which may be signed instead of each individual transaction
                    format: bytes
            description: Response message with topology transactions and the multi-hash to be signed.
        GetActiveContractsRequest:
            type: object
            properties:
                active_at_offset:
                    type: string
                    description: |-
                        The offset at which the snapshot of the active contracts will be computed.
                         Must be no greater than the current ledger end offset.
                         Must be greater than or equal to the last pruning offset.
                         Required, must be a valid absolute offset (positive integer) or ledger begin offset (zero).
                         If zero, the empty set will be returned.
                event_format:
                    allOf:
                        - $ref: '#/components/schemas/EventFormat'
                    description: |-
                        Format of the contract_entries in the result. In case of CreatedEvent the presentation will be of
                         TRANSACTION_SHAPE_ACS_DELTA.
                         Optional for backwards compatibility, defaults to an EventFormat where:

                         - filters_by_party is the filter.filters_by_party from this request
                         - filters_for_any_party is the filter.filters_for_any_party from this request
                         - verbose is the verbose field from this request
            description: |-
                If the given offset is different than the ledger end, and there are (un)assignments in-flight at the given offset,
                 the snapshot may fail with "FAILED_PRECONDITION/PARTICIPANT_PRUNED_DATA_ACCESSED".
                 Note that it is ok to request acs snapshots for party migration with offsets other than ledger end, because party
                 migration is not concerned with incomplete (un)assignments.
        GetActiveContractsResponse:
            type: object
            properties:
                workflow_id:
                    type: string
                    description: |-
                        The workflow ID used in command submission which corresponds to the contract_entry. Only set if
                         the ``workflow_id`` for the command was set.
                         Must be a valid LedgerString (as described in ``value.proto``).
                         Optional
                active_contract:
                    allOf:
                        - $ref: '#/components/schemas/ActiveContract'
                    description: |-
                        The contract is active on the assigned synchronizer, meaning: there was an activation event on the given synchronizer (
                         created, assigned), which is not followed by a deactivation event (archived, unassigned) on the same
                         synchronizer, until the active_at_offset.
                         Since activeness is defined as a per synchronizer concept, it is possible, that a contract is active on one
                         synchronizer, but already archived on another.
                         There will be one such message for each synchronizer the contract is active on.
                incomplete_unassigned:
                    allOf:
                        - $ref: '#/components/schemas/IncompleteUnassigned'
                    description: |-
                        Included iff the unassigned event was before or at the active_at_offset, but there was no corresponding
                         assigned event before or at the active_at_offset.
                incomplete_assigned:
                    allOf:
                        - $ref: '#/components/schemas/IncompleteAssigned'
                    description: |-
                        Important: this message is not indicating that the contract is active on the target synchronizer!
                         Included iff the assigned event was before or at the active_at_offset, but there was no corresponding
                         unassigned event before or at the active_at_offset.
        GetConnectedSynchronizersResponse:
            type: object
            properties:
                connected_synchronizers:
                    type: array
                    items:
                        $ref: '#/components/schemas/GetConnectedSynchronizersResponse_ConnectedSynchronizer'
        GetConnectedSynchronizersResponse_ConnectedSynchronizer:
            type: object
            properties:
                synchronizer_alias:
                    type: string
                    description: |-
                        The alias of the synchronizer
                         Required
                synchronizer_id:
                    type: string
                    description: |-
                        The ID of the synchronizer
                         Required
                permission:
                    type: integer
                    description: |-
                        The permission on the synchronizer
                         Set if a party was used in the request, otherwise unspecified.
                         Optional
                    format: enum
        GetContractRequest:
            type: object
            properties:
                contract_id:
                    type: string
                    description: |-
                        The ID of the contract.
                         Must be a valid LedgerString (as described in ``value.proto``).
                         Required
                querying_parties:
                    type: array
                    items:
                        type: string
                    description: |-
                        The list of querying parties
                         The stakeholders of the referenced contract must have an intersection with any of these parties
                         to return the result.
                         Optional, if no querying_parties specified, all possible contracts could be returned.
        GetContractResponse:
            type: object
            properties:
                created_event:
                    allOf:
                        - $ref: '#/components/schemas/CreatedEvent'
                    description: |-
                        The representative_package_id will be always set to the contract package ID, therefore this endpoint should
                         not be used to lookup contract which entered the participant via party replication or repair service.
                         The witnesses field will contain only the querying_parties which are also stakeholders of the contract as well.
                         The following fields of the created event cannot be populated, so those should not be used / parsed:

                         - offset
                         - node_id
                         - created_event_blob
                         - interface_views
                         - acs_delta

                         Required
        GetEventsByContractIdRequest:
            type: object
            properties:
                contract_id:
                    type: string
                    description: |-
                        The contract id being queried.
                         Required
                event_format:
                    allOf:
                        - $ref: '#/components/schemas/EventFormat'
                    description: |-
                        Format of the events in the result, the presentation will be of TRANSACTION_SHAPE_ACS_DELTA.
                         Required
        GetEventsByContractIdResponse:
            type: object
            properties:
                created:
                    allOf:
                        - $ref: '#/components/schemas/Created'
                    description: |-
                        The create event for the contract with the ``contract_id`` given in the request
                         provided it exists and has not yet been pruned.
                         Optional
                archived:
                    allOf:
                        - $ref: '#/components/schemas/Archived'
                    description: |-
                        The archive event for the contract with the ``contract_id`` given in the request
                         provided such an archive event exists and it has not yet been pruned.
                         Optional
        GetIdentityProviderConfigResponse:
            type: object
            properties:
                identity_provider_config:
                    $ref: '#/components/schemas/IdentityProviderConfig'
        GetLatestPrunedOffsetsResponse:
            type: object
            properties:
                participant_pruned_up_to_inclusive:
                    type: string
                    description: |-
                        It will always be a non-negative integer.
                         If positive, the absolute offset up to which the ledger has been pruned,
                         disregarding the state of all divulged contracts pruning.
                         If zero, the ledger has not been pruned yet.
                all_divulged_contracts_pruned_up_to_inclusive:
                    type: string
                    description: |-
                        It will always be a non-negative integer.
                         If positive, the absolute offset up to which all divulged events have been pruned on the ledger.
                         It can be at or before the ``participant_pruned_up_to_inclusive`` offset.
                         For more details about all divulged events pruning,
                         see ``PruneRequest.prune_all_divulged_contracts`` in ``participant_pruning_service.proto``.
                         If zero, the divulged events have not been pruned yet.
        GetLedgerApiVersionResponse:
            type: object
            properties:
                version:
                    type: string
                    description: The version of the ledger API.
                features:
                    allOf:
                        - $ref: '#/components/schemas/FeaturesDescriptor'
                    description: |-
                        The features supported by this Ledger API endpoint.

                         Daml applications CAN use the feature descriptor on top of
                         version constraints on the Ledger API version to determine
                         whether a given Ledger API endpoint supports the features
                         required to run the application.

                         See the feature descriptions themselves for the relation between
                         Ledger API versions and feature presence.
        GetLedgerEndResponse:
            type: object
            properties:
                offset:
                    type: string
                    description: |-
                        It will always be a non-negative integer.
                         If zero, the participant view of the ledger is empty.
                         If positive, the absolute offset of the ledger as viewed by the participant.
        GetPackageResponse:
            type: object
            properties:
                hash_function:
                    type: integer
                    description: |-
                        The hash function we use to calculate the hash.
                         Required
                    format: enum
                archive_payload:
                    type: string
                    description: |-
                        Contains a ``daml_lf`` ArchivePayload. See further details in ``daml_lf.proto``.
                         Required
                    format: bytes
                hash:
                    type: string
                    description: |-
                        The hash of the archive payload, can also used as a ``package_id``.
                         Must be a valid PackageIdString (as described in ``value.proto``).
                         Required
        GetPackageStatusResponse:
            type: object
            properties:
                package_status:
                    type: integer
                    description: The status of the package.
                    format: enum
        GetParticipantIdResponse:
            type: object
            properties:
                participant_id:
                    type: string
                    description: |-
                        Identifier of the participant, which SHOULD be globally unique.
                         Must be a valid LedgerString (as describe in ``value.proto``).
        GetPartiesResponse:
            type: object
            properties:
                party_details:
                    type: array
                    items:
                        $ref: '#/components/schemas/PartyDetails'
                    description: |-
                        The details of the requested Daml parties by the participant, if known.
                         The party details may not be in the same order as requested.
                         Required
        GetPreferredPackageVersionResponse:
            type: object
            properties:
                package_preference:
                    allOf:
                        - $ref: '#/components/schemas/PackagePreference'
                    description: |-
                        Not populated when no preferred package is found
                         Optional
        GetPreferredPackagesRequest:
            type: object
            properties:
                package_vetting_requirements:
                    type: array
                    items:
                        $ref: '#/components/schemas/PackageVettingRequirement'
                    description: |-
                        The package-name vetting requirements for which the preferred packages should be resolved.

                         Generally it is enough to provide the requirements for the intended command's root package-names.
                         Additional package-name requirements can be provided when additional Daml transaction informees need to use
                         package dependencies of the command's root packages.

                         Required
                synchronizer_id:
                    type: string
                    description: |-
                        The synchronizer whose vetting state should be used for resolving this query.
                         If not specified, the vetting states of all synchronizers to which the participant is connected are used.
                         Optional
                vetting_valid_at:
                    type: string
                    description: |-
                        The timestamp at which the package vetting validity should be computed
                         on the latest topology snapshot as seen by the participant.
                         If not provided, the participant's current clock time is used.
                         Optional
                    format: date-time
        GetPreferredPackagesResponse:
            type: object
            properties:
                package_references:
                    type: array
                    items:
                        $ref: '#/components/schemas/PackageReference'
                    description: |-
                        The package references of the preferred packages.
                         Must contain one package reference for each requested package-name.

                         If you build command submissions whose content depends on the returned
                         preferred packages, then we recommend submitting the preferred package-ids
                         in the ``package_id_selection_preference`` of the command submission to
                         avoid race conditions with concurrent changes of the on-ledger package vetting state.

                         Required
                synchronizer_id:
                    type: string
                    description: |-
                        The synchronizer for which the package preferences are computed.
                         If the synchronizer_id was specified in the request, then it matches the request synchronizer_id.
                         Required
        GetUpdateByIdRequest:
            type: object
            properties:
                update_id:
                    type: string
                    description: |-
                        The ID of a particular update.
                         Must be a valid LedgerString (as described in ``value.proto``).
                         Required
                update_format:
                    allOf:
                        - $ref: '#/components/schemas/UpdateFormat'
                    description: |-
                        The format for the update.
                         Required
        GetUpdateByOffsetRequest:
            type: object
            properties:
                offset:
                    type: string
                    description: |-
                        The offset of the update being looked up.
                         Must be a valid absolute offset (positive integer).
                         Required
                update_format:
                    allOf:
                        - $ref: '#/components/schemas/UpdateFormat'
                    description: |-
                        The format for the update.
                         Required
        GetUpdateResponse:
            type: object
            properties:
                transaction:
                    $ref: '#/components/schemas/Transaction'
                reassignment:
                    $ref: '#/components/schemas/Reassignment'
                topology_transaction:
                    $ref: '#/components/schemas/TopologyTransaction'
        GetUpdatesRequest:
            type: object
            properties:
                begin_exclusive:
                    type: string
                    description: |-
                        Beginning of the requested ledger section (non-negative integer).
                         The response will only contain transactions whose offset is strictly greater than this.
                         If zero, the stream will start from the beginning of the ledger.
                         If positive, the streaming will start after this absolute offset.
                         If the ledger has been pruned, this parameter must be specified and be greater than the pruning offset.
                end_inclusive:
                    type: string
                    description: |-
                        End of the requested ledger section.
                         The response will only contain transactions whose offset is less than or equal to this.
                         Optional, if empty, the stream will not terminate.
                         If specified, the stream will terminate after this absolute offset (positive integer) is reached.
                update_format:
                    allOf:
                        - $ref: '#/components/schemas/UpdateFormat'
                    description: |-
                        Must be unset for GetUpdateTrees request.
                         Optional for backwards compatibility for GetUpdates request: defaults to an UpdateFormat where:

                         - include_transactions.event_format.filters_by_party = the filter.filters_by_party on this request
                         - include_transactions.event_format.filters_for_any_party = the filter.filters_for_any_party on this request
                         - include_transactions.event_format.verbose = the same flag specified on this request
                         - include_transactions.transaction_shape = TRANSACTION_SHAPE_ACS_DELTA
                         - include_reassignments.filter = the same filter specified on this request
                         - include_reassignments.verbose = the same flag specified on this request
                         - include_topology_events.include_participant_authorization_events.parties = all the parties specified in filter
        GetUpdatesResponse:
            type: object
            properties:
                transaction:
                    $ref: '#/components/schemas/Transaction'
                reassignment:
                    $ref: '#/components/schemas/Reassignment'
                offset_checkpoint:
                    $ref: '#/components/schemas/OffsetCheckpoint'
                topology_transaction:
                    $ref: '#/components/schemas/TopologyTransaction'
        GetUserResponse:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: Retrieved user.
        GlobalKey:
            type: object
            properties:
                template_id:
                    allOf:
                        - $ref: '#/components/schemas/Identifier'
                    description: The identifier uses the package-id reference format.
                package_name:
                    type: string
                key:
                    $ref: '#/components/schemas/Value'
                hash:
                    type: string
                    format: bytes
        GoogleProtobufAny:
            type: object
            properties:
                '@type':
                    type: string
                    description: The type of the serialized message.
            additionalProperties: true
            description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
        GrantUserRightsRequest:
            type: object
            properties:
                user_id:
                    type: string
                    description: |-
                        The user to whom to grant rights.
                         Required
                rights:
                    type: array
                    items:
                        $ref: '#/components/schemas/Right'
                    description: |-
                        The rights to grant.
                         Optional
                identity_provider_id:
                    type: string
                    description: |-
                        The id of the ``Identity Provider``
                         Optional, if not set, assume the user is managed by the default identity provider.
            description: |-
                Add the rights to the set of rights granted to the user.

                 Required authorization: ``HasRight(ParticipantAdmin) OR IsAuthenticatedIdentityProviderAdmin(identity_provider_id)``
        GrantUserRightsResponse:
            type: object
            properties:
                newly_granted_rights:
                    type: array
                    items:
                        $ref: '#/components/schemas/Right'
                    description: The rights that were newly granted by the request.
        Identifier:
            type: object
            properties:
                package_id:
                    type: string
                    description: |-
                        Generally, the identifier of the Daml package that contains the entity.
                         When encoding a package-id, it must be a valid PackageIdString.

                         The field is overloaded to also be able to contain the package-name of the Daml package.
                         This is supported if the entity referenced is either an interface or template.
                         When representing the Daml package-name, the encoding is of form `#<package-name>`
                         where `#` (not a valid package-id character)
                         is used as a discriminator for signalling a package-name encoding.

                         Required
                module_name:
                    type: string
                    description: |-
                        The dot-separated module name of the identifier.
                         Required
                entity_name:
                    type: string
                    description: |-
                        The dot-separated name of the entity (e.g. record, template, ...) within the module.
                         Required
            description: |-
                Unique identifier of an entity.
                 Throughout this API, the following terminology is being used:

                   - if a Daml package-id is encoded in the package_id field, it is referred to as using a "package-id reference format"
                   - if a Daml package-name is encoded in the package_id field, it is referred to as using a "package-name reference format"
        IdentityProviderConfig:
            type: object
            properties:
                identity_provider_id:
                    type: string
                    description: |-
                        The identity provider identifier
                         Must be a valid LedgerString (as describe in ``value.proto``).
                         Required
                is_deactivated:
                    type: boolean
                    description: |-
                        When set, the callers using JWT tokens issued by this identity provider are denied all access
                         to the Ledger API.
                         Optional,
                         Modifiable
                issuer:
                    type: string
                    description: |-
                        Specifies the issuer of the JWT token.
                         The issuer value is a case sensitive URL using the https scheme that contains scheme, host,
                         and optionally, port number and path components and no query or fragment components.
                         Required
                         Modifiable
                jwks_url:
                    type: string
                    description: |-
                        The JWKS (JSON Web Key Set) URL.
                         The Ledger API uses JWKs (JSON Web Keys) from the provided URL to verify that the JWT has been
                         signed with the loaded JWK. Only RS256 (RSA Signature with SHA-256) signing algorithm is supported.
                         Required
                         Modifiable
                audience:
                    type: string
                    description: |-
                        Specifies the audience of the JWT token.
                         When set, the callers using JWT tokens issued by this identity provider are allowed to get an access
                         only if the "aud" claim includes the string specified here
                         Optional,
                         Modifiable
        IncompleteAssigned:
            type: object
            properties:
                assigned_event:
                    allOf:
                        - $ref: '#/components/schemas/AssignedEvent'
                    description: Required
        IncompleteUnassigned:
            type: object
            properties:
                created_event:
                    allOf:
                        - $ref: '#/components/schemas/CreatedEvent'
                    description: |-
                        Required
                         The event as it appeared in the context of its last activation update (i.e. daml transaction or
                         reassignment). In particular, the last activation offset, node_id pair is preserved.
                         The last activation update is the most recent update created or assigned this contract on synchronizer_id synchronizer before
                         the unassigned_event.
                         The offset of the CreatedEvent might point to an already pruned update, therefore it cannot necessarily be used
                         for lookups.
                unassigned_event:
                    allOf:
                        - $ref: '#/components/schemas/UnassignedEvent'
                    description: Required
        InterfaceFilter:
            type: object
            properties:
                interface_id:
                    allOf:
                        - $ref: '#/components/schemas/Identifier'
                    description: |-
                        The interface that a matching contract must implement.
                         The ``interface_id`` needs to be valid: corresponding interface should be defined in
                         one of the available packages at the time of the query.
                         Both package-name and package-id reference formats for the identifier are supported.
                         Note: The package-id reference identifier format is deprecated. We plan to end support for this format in version 3.4.

                         Required
                include_interface_view:
                    type: boolean
                    description: |-
                        Whether to include the interface view on the contract in the returned ``CreatedEvent``.
                         Use this to access contract data in a uniform manner in your API client.
                         Optional
                include_created_event_blob:
                    type: boolean
                    description: |-
                        Whether to include a ``created_event_blob`` in the returned ``CreatedEvent``.
                         Use this to access the contract create event payload in your API client
                         for submitting it as a disclosed contract with future commands.
                         Optional
            description: This filter matches contracts that implement a specific interface.
        InterfaceView:
            type: object
            properties:
                interface_id:
                    allOf:
                        - $ref: '#/components/schemas/Identifier'
                    description: |-
                        The interface implemented by the matched event.
                         The identifier uses the package-id reference format.

                         Required
                view_status:
                    allOf:
                        - $ref: '#/components/schemas/Status'
                    description: |-
                        Whether the view was successfully computed, and if not,
                         the reason for the error. The error is reported using the same rules
                         for error codes and messages as the errors returned for API requests.
                         Required
                view_value:
                    allOf:
                        - $ref: '#/components/schemas/Record'
                    description: |-
                        The value of the interface's view method on this event.
                         Set if it was requested in the ``InterfaceFilter`` and it could be
                         successfully computed.
                         Optional
            description: View of a create event matched by an interface filter.
        List:
            type: object
            properties:
                elements:
                    type: array
                    items:
                        $ref: '#/components/schemas/Value'
                    description: |-
                        The elements must all be of the same concrete value type.
                         Optional
            description: A homogenous collection of values.
        ListIdentityProviderConfigsResponse:
            type: object
            properties:
                identity_provider_configs:
                    type: array
                    items:
                        $ref: '#/components/schemas/IdentityProviderConfig'
        ListKnownPartiesResponse:
            type: object
            properties:
                party_details:
                    type: array
                    items:
                        $ref: '#/components/schemas/PartyDetails'
                    description: |-
                        The details of all Daml parties known by the participant.
                         Required
                next_page_token:
                    type: string
                    description: |-
                        Pagination token to retrieve the next page.
                         Empty, if there are no further results.
        ListPackagesResponse:
            type: object
            properties:
                package_ids:
                    type: array
                    items:
                        type: string
                    description: |-
                        The IDs of all Daml-LF packages supported by the server.
                         Each element must be a valid PackageIdString (as described in ``value.proto``).
                         Required
        ListUserRightsResponse:
            type: object
            properties:
                rights:
                    type: array
                    items:
                        $ref: '#/components/schemas/Right'
                    description: All rights of the user.
        ListUsersResponse:
            type: object
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/User'
                    description: A subset of users of the participant node that fit into this page.
                next_page_token:
                    type: string
                    description: |-
                        Pagination token to retrieve the next page.
                         Empty, if there are no further results.
        ListVettedPackagesRequest:
            type: object
            properties:
                package_metadata_filter:
                    allOf:
                        - $ref: '#/components/schemas/PackageMetadataFilter'
                    description: |-
                        The package metadata filter the returned vetted packages set must satisfy.
                         Optional
                topology_state_filter:
                    allOf:
                        - $ref: '#/components/schemas/TopologyStateFilter'
                    description: |-
                        The topology filter the returned vetted packages set must satisfy.
                         Optional
                page_token:
                    type: string
                    description: |-
                        Pagination token to determine the specific page to fetch. Using the token
                         guarantees that ``VettedPackages`` on a subsequent page are all greater
                         (``VettedPackages`` are sorted by synchronizer ID then participant ID) than
                         the last ``VettedPackages`` on a previous page.

                         The server does not store intermediate results between calls chained by a
                         series of page tokens. As a consequence, if new vetted packages are being
                         added and a page is requested twice using the same token, more packages can
                         be returned on the second call.

                         Leave unspecified (i.e. as empty string) to fetch the first page.

                         Optional
                page_size:
                    type: integer
                    description: |-
                        Maximum number of ``VettedPackages`` results to return in a single page.

                         If the page_size is unspecified (i.e. left as 0), the server will decide
                         the number of results to be returned.

                         If the page_size exceeds the maximum supported by the server, an
                         error will be returned.

                         To obtain the server's maximum consult the PackageService descriptor
                         available in the VersionService.

                         Optional
                    format: uint32
        ListVettedPackagesResponse:
            type: object
            properties:
                vetted_packages:
                    type: array
                    items:
                        $ref: '#/components/schemas/VettedPackages'
                    description: |-
                        All ``VettedPackages`` that contain at least one ``VettedPackage`` matching
                         both a ``PackageMetadataFilter`` and a ``TopologyStateFilter``.
                         Sorted by synchronizer_id then participant_id.
                next_page_token:
                    type: string
                    description: |-
                        Pagination token to retrieve the next page.
                         Empty string if there are no further results.
        Metadata:
            type: object
            properties:
                submitter_info:
                    $ref: '#/components/schemas/Metadata_SubmitterInfo'
                synchronizer_id:
                    type: string
                mediator_group:
                    type: integer
                    format: uint32
                transaction_uuid:
                    type: string
                preparation_time:
                    type: string
                input_contracts:
                    type: array
                    items:
                        $ref: '#/components/schemas/Metadata_InputContract'
                min_ledger_effective_time:
                    type: string
                    description: |-
                        Where ledger time constraints are imposed during the execution of the contract they will be populated
                         in the fields below. These are optional because if the transaction does NOT depend on time, these values
                         do not need to be set.
                         The final ledger effective time used will be chosen when the command is submitted through the [execute] RPC.
                         If the ledger effective time is outside of any populated min/max bounds then a different transaction
                         can result, that will cause a confirmation message rejection.
                max_ledger_effective_time:
                    type: string
                global_key_mapping:
                    type: array
                    items:
                        $ref: '#/components/schemas/Metadata_GlobalKeyMappingEntry'
                    description: |-
                        Contextual information needed to process the transaction but not signed, either because it's already indirectly
                         signed by signing the transaction, or because it doesn't impact the ledger state
                max_record_time:
                    type: string
                    description: |-
                        Maximum timestamp at which the transaction can be recorded onto the ledger via the synchronizer `synchronizer_id`.
                         If submitted after it will be rejected even if otherwise valid, in which case it needs to be prepared and signed again
                         with a new valid max_record_time.
                         Unsigned in 3.3 to avoid a breaking protocol change
                         Will be signed in 3.4+
                         Set max_record_time in the PreparedTransactionRequest to get this field set accordingly
            description: |-
                Transaction Metadata
                 Refer to the hashing documentation for information on how it should be hashed.
        Metadata_GlobalKeyMappingEntry:
            type: object
            properties:
                key:
                    $ref: '#/components/schemas/GlobalKey'
                value:
                    $ref: '#/components/schemas/Value'
        Metadata_InputContract:
            type: object
            properties:
                v1:
                    allOf:
                        - $ref: '#/components/schemas/Create'
                    description: When new versions will be added, they will show here
                created_at:
                    type: string
                event_blob:
                    type: string
                    format: bytes
        Metadata_SubmitterInfo:
            type: object
            properties:
                act_as:
                    type: array
                    items:
                        type: string
                command_id:
                    type: string
        MinLedgerTime:
            type: object
            properties:
                min_ledger_time_abs:
                    type: string
                    description: |-
                        Lower bound for the ledger time assigned to the resulting transaction.
                         The ledger time of a transaction is assigned as part of command interpretation.
                         Important note: for interactive submissions, if the transaction depends on time, it **must** be signed
                         and submitted within a time window around the ledger time assigned to the transaction during the prepare method.
                         The time delta around that ledger time is a configuration of the ledger, usually short, around 1 minute.
                         If however the transaction does not depend on time, the available time window to sign and submit the transaction is bound
                         by the preparation time, which is also assigned in the "prepare" step (this request),
                         but can be configured with a much larger skew, allowing for more time to sign the request (in the order of hours).
                         Must not be set at the same time as min_ledger_time_rel.
                         Optional
                    format: date-time
                min_ledger_time_rel:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: |-
                        Same as min_ledger_time_abs, but specified as a duration, starting from the time this request is received by the server.
                         Must not be set at the same time as min_ledger_time_abs.
                         Optional
        Node:
            type: object
            properties:
                create:
                    $ref: '#/components/schemas/Create'
                fetch:
                    $ref: '#/components/schemas/Fetch'
                exercise:
                    $ref: '#/components/schemas/Exercise'
                rollback:
                    $ref: '#/components/schemas/Rollback'
        ObjectMeta:
            type: object
            properties:
                resource_version:
                    type: string
                    description: |-
                        An opaque, non-empty value, populated by a participant server which represents the internal version of the resource
                         this ``ObjectMeta`` message is attached to. The participant server will change it to a unique value each time the corresponding resource is updated.
                         You must not rely on the format of resource version. The participant server might change it without notice.
                         You can obtain the newest resource version value by issuing a read request.
                         You may use it for concurrent change detection by passing it back unmodified in an update request.
                         The participant server will then compare the passed value with the value maintained by the system to determine
                         if any other updates took place since you had read the resource version.
                         Upon a successful update you are guaranteed that no other update took place during your read-modify-write sequence.
                         However, if another update took place during your read-modify-write sequence then your update will fail with an appropriate error.
                         Concurrent change control is optional. It will be applied only if you include a resource version in an update request.
                         When creating a new instance of a resource you must leave the resource version empty.
                         Its value will be populated by the participant server upon successful resource creation.
                         Optional
                annotations:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        A set of modifiable key-value pairs that can be used to represent arbitrary, client-specific metadata.
                         Constraints:

                         1. The total size over all keys and values cannot exceed 256kb in UTF-8 encoding.
                         2. Keys are composed of an optional prefix segment and a required name segment such that:

                            - key prefix, when present, must be a valid DNS subdomain with at most 253 characters, followed by a '/' (forward slash) character,
                            - name segment must have at most 63 characters that are either alphanumeric ([a-z0-9A-Z]), or a '.' (dot), '-' (dash) or '_' (underscore);
                              and it must start and end with an alphanumeric character.

                         3. Values can be any non-empty strings.

                         Keys with empty prefix are reserved for end-users.
                         Properties set by external tools or internally by the participant server must use non-empty key prefixes.
                         Duplicate keys are disallowed by the semantics of the protobuf3 maps.
                         See: https://developers.google.com/protocol-buffers/docs/proto3#maps
                         Annotations may be a part of a modifiable resource.
                         Use the resource's update RPC to update its annotations.
                         In order to add a new annotation or update an existing one using an update RPC, provide the desired annotation in the update request.
                         In order to remove an annotation using an update RPC, provide the target annotation's key but set its value to the empty string in the update request.
                         Optional
                         Modifiable
            description: |-
                Represents metadata corresponding to a participant resource (e.g. a participant user or participant local information about a party).

                 Based on ``ObjectMeta`` meta used in Kubernetes API.
                 See https://github.com/kubernetes/apimachinery/blob/master/pkg/apis/meta/v1/generated.proto#L640
        OffsetCheckpoint:
            type: object
            properties:
                offset:
                    type: string
                    description: |-
                        The participant's offset, the details of the offset field are described in ``community/ledger-api/README.md``.
                         Required, must be a valid absolute offset (positive integer).
                synchronizer_times:
                    type: array
                    items:
                        $ref: '#/components/schemas/SynchronizerTime'
            description: |-
                OffsetCheckpoints may be used to:

                 - detect time out of commands.
                 - provide an offset which can be used to restart consumption.
        OffsetCheckpointFeature:
            type: object
            properties:
                max_offset_checkpoint_emission_delay:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: The maximum delay to emmit a new OffsetCheckpoint if it exists
        Optional:
            type: object
            properties:
                value:
                    $ref: '#/components/schemas/Value'
            description: |-
                Corresponds to Java's Optional type, Scala's Option, and Haskell's Maybe.
                 The reason why we need to wrap this in an additional ``message`` is that we
                 need to be able to encode the ``None`` case in the ``Value`` oneof.
        PackageFeature:
            type: object
            properties:
                max_vetted_packages_page_size:
                    type: integer
                    description: |-
                        The maximum number of vetted packages the server can return in a single
                         response (page) when listing them.
                    format: int32
        PackageMetadataFilter:
            type: object
            properties:
                package_ids:
                    type: array
                    items:
                        type: string
                    description: |-
                        If this list is non-empty, any vetted package with a package ID in this
                         list will match the filter.
                package_name_prefixes:
                    type: array
                    items:
                        type: string
                    description: |-
                        If this list is non-empty, any vetted package with a name matching at least
                         one prefix in this list will match the filter.
            description: |-
                Filter the VettedPackages by package metadata.

                 A PackageMetadataFilter without package_ids and without package_name_prefixes
                 matches any vetted package.

                 Non-empty fields specify candidate values of which at least one must match.
                 If both fields are set, then a candidate is returned if it matches one of the fields.
        PackagePreference:
            type: object
            properties:
                package_reference:
                    allOf:
                        - $ref: '#/components/schemas/PackageReference'
                    description: |-
                        The package reference of the preferred package.
                         Required
                synchronizer_id:
                    type: string
                    description: |-
                        The synchronizer for which the preferred package was computed.
                         If the synchronizer_id was specified in the request, then it matches the request synchronizer_id.
                         Required
        PackageReference:
            type: object
            properties:
                package_id:
                    type: string
                    description: Required
                package_name:
                    type: string
                    description: Required
                package_version:
                    type: string
                    description: Required
        PackageVettingRequirement:
            type: object
            properties:
                parties:
                    type: array
                    items:
                        type: string
                    description: |-
                        The parties whose participants' vetting state should be considered when resolving the preferred package.
                         Required
                package_name:
                    type: string
                    description: |-
                        The package-name for which the preferred package should be resolved.
                         Required
            description: Defines a package-name for which the commonly vetted package with the highest version must be found.
        ParticipantAuthorizationAdded:
            type: object
            properties:
                party_id:
                    type: string
                    description: Required
                participant_id:
                    type: string
                    description: Required
                participant_permission:
                    type: integer
                    description: Required
                    format: enum
        ParticipantAuthorizationChanged:
            type: object
            properties:
                party_id:
                    type: string
                    description: Required
                participant_id:
                    type: string
                    description: Required
                participant_permission:
                    type: integer
                    description: Required
                    format: enum
        ParticipantAuthorizationRevoked:
            type: object
            properties:
                party_id:
                    type: string
                    description: Required
                participant_id:
                    type: string
                    description: Required
        ParticipantAuthorizationTopologyFormat:
            type: object
            properties:
                parties:
                    type: array
                    items:
                        type: string
                    description: |-
                        List of parties for which the topology transactions should be sent.
                         Empty means: for all parties.
            description: A format specifying which participant authorization topology transactions to include and how to render them.
        PartyDetails:
            type: object
            properties:
                party:
                    type: string
                    description: |-
                        The stable unique identifier of a Daml party.
                         Must be a valid PartyIdString (as described in ``value.proto``).
                         Required
                is_local:
                    type: boolean
                    description: |-
                        true if party is hosted by the participant and the party shares the same identity provider as the user issuing the request.
                         Optional
                local_metadata:
                    allOf:
                        - $ref: '#/components/schemas/ObjectMeta'
                    description: |-
                        Participant-local metadata of this party.
                         Optional,
                         Modifiable
                identity_provider_id:
                    type: string
                    description: |-
                        The id of the ``Identity Provider``
                         Optional, if not set, there could be 3 options:

                         1. the party is managed by the default identity provider.
                         2. party is not hosted by the participant.
                         3. party is hosted by the participant, but is outside of the user's identity provider.
        PartyManagementFeature:
            type: object
            properties:
                max_parties_page_size:
                    type: integer
                    description: The maximum number of parties the server can return in a single response (page).
                    format: int32
        PartySignatures:
            type: object
            properties:
                signatures:
                    type: array
                    items:
                        $ref: '#/components/schemas/SinglePartySignatures'
                    description: |-
                        Additional signatures provided by all individual parties
                         Required
            description: Additional signatures provided by the submitting parties
        PrefetchContractKey:
            type: object
            properties:
                template_id:
                    allOf:
                        - $ref: '#/components/schemas/Identifier'
                    description: |-
                        The template of contract the client wants to prefetch.
                         Both package-name and package-id reference identifier formats for the template-id are supported.
                         Note: The package-id reference identifier format is deprecated. We plan to end support for this format in version 3.4.

                         Required
                contract_key:
                    allOf:
                        - $ref: '#/components/schemas/Value'
                    description: |-
                        The key of the contract the client wants to prefetch.
                         Required
            description: Preload contracts
        PrepareSubmissionRequest:
            type: object
            properties:
                user_id:
                    type: string
                    description: |-
                        Uniquely identifies the participant user that prepares the transaction.
                         Must be a valid UserIdString (as described in ``value.proto``).
                         Required unless authentication is used with a user token.
                         In that case, the token's user-id will be used for the request's user_id.
                         Optional
                command_id:
                    type: string
                    description: |-
                        Uniquely identifies the command.
                         The triple (user_id, act_as, command_id) constitutes the change ID for the intended ledger change,
                         where act_as is interpreted as a set of party names.
                         The change ID can be used for matching the intended ledger changes with all their completions.
                         Must be a valid LedgerString (as described in ``value.proto``).
                         Required
                commands:
                    type: array
                    items:
                        $ref: '#/components/schemas/Command'
                    description: |-
                        Individual elements of this atomic command. Must be non-empty.
                         Limitation: Only single command transaction are currently supported by the API.
                         The field is marked as repeated in preparation for future support of multiple commands.
                         Required
                min_ledger_time:
                    allOf:
                        - $ref: '#/components/schemas/MinLedgerTime'
                    description: Optional
                max_record_time:
                    type: string
                    description: |-
                        Maximum timestamp at which the transaction can be recorded onto the ledger via the synchronizer specified in the `PrepareSubmissionResponse`.
                         If submitted after it will be rejected even if otherwise valid, in which case it needs to be prepared and signed again
                         with a new valid max_record_time.
                         Use this to limit the time-to-life of a prepared transaction,
                         which is useful to know when it can definitely not be accepted
                         anymore and resorting to preparing another transaction for the same
                         intent is safe again.
                         Optional
                    format: date-time
                act_as:
                    type: array
                    items:
                        type: string
                    description: |-
                        Set of parties on whose behalf the command should be executed, if submitted.
                         If ledger API authorization is enabled, then the authorization metadata must authorize the sender of the request
                         to **read** (not act) on behalf of each of the given parties. This is because this RPC merely prepares a transaction
                         and does not execute it. Therefore read authorization is sufficient even for actAs parties.
                         Note: This may change, and more specific authorization scope may be introduced in the future.
                         Each element must be a valid PartyIdString (as described in ``value.proto``).
                         Required, must be non-empty.
                read_as:
                    type: array
                    items:
                        type: string
                    description: |-
                        Set of parties on whose behalf (in addition to all parties listed in ``act_as``) contracts can be retrieved.
                         This affects Daml operations such as ``fetch``, ``fetchByKey``, ``lookupByKey``, ``exercise``, and ``exerciseByKey``.
                         Note: A command can only use contracts that are visible to at least
                         one of the parties in ``act_as`` or ``read_as``. This visibility check is independent from the Daml authorization
                         rules for fetch operations.
                         If ledger API authorization is enabled, then the authorization metadata must authorize the sender of the request
                         to read contract data on behalf of each of the given parties.
                         Optional
                disclosed_contracts:
                    type: array
                    items:
                        $ref: '#/components/schemas/DisclosedContract'
                    description: |-
                        Additional contracts used to resolve contract & contract key lookups.
                         Optional
                synchronizer_id:
                    type: string
                    description: |-
                        Must be a valid synchronizer id
                         If not set, a suitable synchronizer that this node is connected to will be chosen
                         Optional
                package_id_selection_preference:
                    type: array
                    items:
                        type: string
                    description: |-
                        The package-id selection preference of the client for resolving
                         package names and interface instances in command submission and interpretation
                         Optional
                verbose_hashing:
                    type: boolean
                    description: |-
                        When true, the response will contain additional details on how the transaction was encoded and hashed
                         This can be useful for troubleshooting of hash mismatches. Should only be used for debugging.
                         Optional, default to false
                prefetch_contract_keys:
                    type: array
                    items:
                        $ref: '#/components/schemas/PrefetchContractKey'
                    description: |-
                        Fetches the contract keys into the caches to speed up the command processing.
                         Should only contain contract keys that are expected to be resolved during interpretation of the commands.
                         Keys of disclosed contracts do not need prefetching.

                         Optional
                estimate_traffic_cost:
                    allOf:
                        - $ref: '#/components/schemas/CostEstimationHints'
                    description: |-
                        Hints to improve the accuracy of traffic cost estimation.
                         The estimation logic assumes that this node will be used for the execution of the transaction
                         If another node is used instead, the estimation may be less precise.
                         Request amplification is not accounted for in the estimation: each amplified request will
                         result in the cost of the confirmation request to be charged additionally.

                         Optional - Traffic cost estimation is enabled by default if this field is not set
                         To turn off cost estimation, set the CostEstimationHints#disabled field to true
        PrepareSubmissionResponse:
            type: object
            properties:
                prepared_transaction:
                    allOf:
                        - $ref: '#/components/schemas/PreparedTransaction'
                    description: |-
                        The interpreted transaction, it represents the ledger changes necessary to execute the commands specified in the request.
                         Clients MUST display the content of the transaction to the user for them to validate before signing the hash if the preparing participant is not trusted.
                prepared_transaction_hash:
                    type: string
                    description: |-
                        Hash of the transaction, this is what needs to be signed by the party to authorize the transaction.
                         Only provided for convenience, clients MUST recompute the hash from the raw transaction if the preparing participant is not trusted.
                         May be removed in future versions
                    format: bytes
                hashing_scheme_version:
                    type: integer
                    description: The hashing scheme version used when building the hash
                    format: enum
                hashing_details:
                    type: string
                    description: |-
                        Optional additional details on how the transaction was encoded and hashed. Only set if verbose_hashing = true in the request
                         Note that there are no guarantees on the stability of the format or content of this field.
                         Its content should NOT be parsed and should only be used for troubleshooting purposes.
                cost_estimation:
                    allOf:
                        - $ref: '#/components/schemas/CostEstimation'
                    description: |-
                        Traffic cost estimation of the prepared transaction
                         Optional
        PreparedTransaction:
            type: object
            properties:
                transaction:
                    allOf:
                        - $ref: '#/components/schemas/DamlTransaction'
                    description: Daml Transaction representing the ledger effect if executed. See below
                metadata:
                    allOf:
                        - $ref: '#/components/schemas/Metadata'
                    description: Metadata context necessary to execute the transaction
            description: |-
                *
                 Prepared Transaction Message
        PriorTopologySerial:
            type: object
            properties:
                prior:
                    type: integer
                    description: Previous transaction's serial.
                    format: uint32
            description: |-
                The serial of last ``VettedPackages`` topology transaction on a given
                 participant and synchronizer.
        Reassignment:
            type: object
            properties:
                update_id:
                    type: string
                    description: |-
                        Assigned by the server. Useful for correlating logs.
                         Must be a valid LedgerString (as described in ``value.proto``).
                         Required
                command_id:
                    type: string
                    description: |-
                        The ID of the command which resulted in this reassignment. Missing for everyone except the submitting party on the submitting participant.
                         Must be a valid LedgerString (as described in ``value.proto``).
                         Optional
                workflow_id:
                    type: string
                    description: |-
                        The workflow ID used in reassignment command submission. Only set if the ``workflow_id`` for the command was set.
                         Must be a valid LedgerString (as described in ``value.proto``).
                         Optional
                offset:
                    type: string
                    description: |-
                        The participant's offset. The details of this field are described in ``community/ledger-api/README.md``.
                         Required, must be a valid absolute offset (positive integer).
                events:
                    type: array
                    items:
                        $ref: '#/components/schemas/ReassignmentEvent'
                    description: The collection of reassignment events. Required.
                trace_context:
                    allOf:
                        - $ref: '#/components/schemas/TraceContext'
                    description: |-
                        Optional; ledger API trace context

                         The trace context transported in this message corresponds to the trace context supplied
                         by the client application in a HTTP2 header of the original command submission.
                         We typically use a header to transfer this type of information. Here we use message
                         body, because it is used in gRPC streams which do not support per message headers.
                         This field will be populated with the trace context contained in the original submission.
                         If that was not provided, a unique ledger-api-server generated trace context will be used
                         instead.
                record_time:
                    type: string
                    description: |-
                        The time at which the reassignment was recorded. The record time refers to the source/target
                         synchronizer for an unassign/assign event respectively.
                         Required
                    format: date-time
                synchronizer_id:
                    type: string
                    description: |-
                        A valid synchronizer id.
                         Identifies the synchronizer that synchronized this Reassignment.
                         Required
            description: Complete view of an on-ledger reassignment.
        ReassignmentCommand:
            type: object
            properties:
                unassign_command:
                    $ref: '#/components/schemas/UnassignCommand'
                assign_command:
                    $ref: '#/components/schemas/AssignCommand'
        ReassignmentCommands:
            type: object
            properties:
                workflow_id:
                    type: string
                    description: |-
                        Identifier of the on-ledger workflow that this command is a part of.
                         Must be a valid LedgerString (as described in ``value.proto``).
                         Optional
                user_id:
                    type: string
                    description: |-
                        Uniquely identifies the participant user that issued the command.
                         Must be a valid UserIdString (as described in ``value.proto``).
                         Required unless authentication is used with a user token.
                         In that case, the token's user-id will be used for the request's user_id.
                command_id:
                    type: string
                    description: |-
                        Uniquely identifies the command.
                         The triple (user_id, submitter, command_id) constitutes the change ID for the intended ledger change.
                         The change ID can be used for matching the intended ledger changes with all their completions.
                         Must be a valid LedgerString (as described in ``value.proto``).
                         Required
                submitter:
                    type: string
                    description: |-
                        Party on whose behalf the command should be executed.
                         If ledger API authorization is enabled, then the authorization metadata must authorize the sender of the request
                         to act on behalf of the given party.
                         Must be a valid PartyIdString (as described in ``value.proto``).
                         Required
                submission_id:
                    type: string
                    description: |-
                        A unique identifier to distinguish completions for different submissions with the same change ID.
                         Typically a random UUID. Applications are expected to use a different UUID for each retry of a submission
                         with the same change ID.
                         Must be a valid LedgerString (as described in ``value.proto``).

                         If omitted, the participant or the committer may set a value of their choice.
                         Optional
                commands:
                    type: array
                    items:
                        $ref: '#/components/schemas/ReassignmentCommand'
                    description: Individual elements of this reassignment. Must be non-empty.
        ReassignmentEvent:
            type: object
            properties:
                unassigned:
                    $ref: '#/components/schemas/UnassignedEvent'
                assigned:
                    $ref: '#/components/schemas/AssignedEvent'
        Record:
            type: object
            properties:
                record_id:
                    allOf:
                        - $ref: '#/components/schemas/Identifier'
                    description: |-
                        Omitted from the transaction stream when verbose streaming is not enabled.
                         Optional when submitting commands.
                fields:
                    type: array
                    items:
                        $ref: '#/components/schemas/RecordField'
                    description: |-
                        The nested values of the record.
                         Required
            description: Contains nested values.
        RecordField:
            type: object
            properties:
                label:
                    type: string
                    description: |-
                        When reading a transaction stream, it's omitted if verbose streaming is not enabled.
                         When submitting a command, it's optional:

                         - if all keys within a single record are present, the order in which fields appear does not matter. however, each key must appear exactly once.
                         - if any of the keys within a single record are omitted, the order of fields MUST match the order of declaration in the Daml template.

                         Must be a valid NameString
                value:
                    allOf:
                        - $ref: '#/components/schemas/Value'
                    description: |-
                        A nested value of a record.
                         Required
            description: A named nested value within a record.
        RevokeUserRightsRequest:
            type: object
            properties:
                user_id:
                    type: string
                    description: |-
                        The user from whom to revoke rights.
                         Required
                rights:
                    type: array
                    items:
                        $ref: '#/components/schemas/Right'
                    description: |-
                        The rights to revoke.
                         Optional
                identity_provider_id:
                    type: string
                    description: |-
                        The id of the ``Identity Provider``
                         Optional, if not set, assume the user is managed by the default identity provider.
            description: |-
                Remove the rights from the set of rights granted to the user.

                 Required authorization: ``HasRight(ParticipantAdmin) OR IsAuthenticatedIdentityProviderAdmin(identity_provider_id)``
        RevokeUserRightsResponse:
            type: object
            properties:
                newly_revoked_rights:
                    type: array
                    items:
                        $ref: '#/components/schemas/Right'
                    description: The rights that were actually revoked by the request.
        Right:
            type: object
            properties:
                participant_admin:
                    allOf:
                        - $ref: '#/components/schemas/Right_ParticipantAdmin'
                    description: The user can administer the participant node.
                can_act_as:
                    allOf:
                        - $ref: '#/components/schemas/Right_CanActAs'
                    description: The user can act as a specific party.
                can_read_as:
                    allOf:
                        - $ref: '#/components/schemas/Right_CanReadAs'
                    description: The user can read ledger data visible to a specific party.
                identity_provider_admin:
                    allOf:
                        - $ref: '#/components/schemas/Right_IdentityProviderAdmin'
                    description: The user can administer users and parties assigned to the same identity provider as the one of the user.
                can_read_as_any_party:
                    allOf:
                        - $ref: '#/components/schemas/Right_CanReadAsAnyParty'
                    description: The user can read as any party on a participant
                can_execute_as:
                    allOf:
                        - $ref: '#/components/schemas/Right_CanExecuteAs'
                    description: The user can prepare and execute submissions as a specific party.
                can_execute_as_any_party:
                    allOf:
                        - $ref: '#/components/schemas/Right_CanExecuteAsAnyParty'
                    description: The user can prepare and execute submissions as any party on a participant.
            description: A right granted to a user.
        Right_CanActAs:
            type: object
            properties:
                party:
                    type: string
                    description: The right to authorize commands for this party.
        Right_CanExecuteAs:
            type: object
            properties:
                party:
                    type: string
                    description: |-
                        The right to prepare and execute submissions as this party.
                         This right does not entitle the user to perform any reads.
                         If reading is required, a separate ReadAs right must be added.
                         Right to execute as a party is also implicitly contained in the CanActAs right.
        Right_CanExecuteAsAnyParty:
            type: object
            properties: {}
            description: |-
                The rights of a user to prepare and execute transactions as any party.
                 Its utility is predominantly for users that perform interactive submissions
                 on behalf of many parties.
        Right_CanReadAs:
            type: object
            properties:
                party:
                    type: string
                    description: The right to read ledger data visible to this party.
        Right_CanReadAsAnyParty:
            type: object
            properties: {}
            description: |-
                The rights of a participant's super reader. Its utility is predominantly for
                 feeding external tools, such as PQS, continually without the need to change subscriptions
                 as new parties pop in and out of existence.
        Right_IdentityProviderAdmin:
            type: object
            properties: {}
            description: |-
                The right to administer the identity provider that the user is assigned to.
                 It means, being able to manage users and parties that are also assigned
                 to the same identity provider.
        Right_ParticipantAdmin:
            type: object
            properties: {}
            description: The right to administer the participant node.
        Rollback:
            type: object
            properties:
                children:
                    type: array
                    items:
                        type: string
            description: Rollback Node
        Signature:
            type: object
            properties:
                format:
                    type: integer
                    format: enum
                signature:
                    type: string
                    format: bytes
                signed_by:
                    type: string
                    description: The fingerprint/id of the keypair used to create this signature and needed to verify.
                signing_algorithm_spec:
                    type: integer
                    description: The signing algorithm specification used to produce this signature
                    format: enum
        SigningPublicKey:
            type: object
            properties:
                format:
                    type: integer
                    description: The serialization format of the public key
                    format: enum
                key_data:
                    type: string
                    description: Serialized public key in the format specified above
                    format: bytes
                key_spec:
                    type: integer
                    description: The key specification
                    format: enum
        SinglePartySignatures:
            type: object
            properties:
                party:
                    type: string
                    description: |-
                        Submitting party
                         Required
                signatures:
                    type: array
                    items:
                        $ref: '#/components/schemas/Signature'
                    description: |-
                        Signatures
                         Required
            description: Signatures provided by a single party
        Status:
            type: object
            properties:
                code:
                    type: integer
                    description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
                    format: int32
                message:
                    type: string
                    description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/GoogleProtobufAny'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
        SubmitAndWaitForReassignmentRequest:
            type: object
            properties:
                reassignment_commands:
                    allOf:
                        - $ref: '#/components/schemas/ReassignmentCommands'
                    description: |-
                        The reassignment commands to be submitted.
                         Required
                event_format:
                    allOf:
                        - $ref: '#/components/schemas/EventFormat'
                    description: |-
                        Optional
                         If no event_format provided, the result will contain no events.
                         The events in the result, will take shape TRANSACTION_SHAPE_ACS_DELTA.
            description: This reassignment is executed as a single atomic update.
        SubmitAndWaitForReassignmentResponse:
            type: object
            properties:
                reassignment:
                    allOf:
                        - $ref: '#/components/schemas/Reassignment'
                    description: |-
                        The reassignment that resulted from the submitted reassignment command.
                         The reassignment might contain no events (request conditions result in filtering out all of them).
                         Required
        SubmitAndWaitForTransactionRequest:
            type: object
            properties:
                commands:
                    allOf:
                        - $ref: '#/components/schemas/Commands'
                    description: |-
                        The commands to be submitted.
                         Required
                transaction_format:
                    allOf:
                        - $ref: '#/components/schemas/TransactionFormat'
                    description: |-
                        If no ``transaction_format`` is provided, a default will be used where ``transaction_shape`` is set to
                         TRANSACTION_SHAPE_ACS_DELTA, ``event_format`` is defined with ``filters_by_party`` containing wildcard-template
                         filter for all original ``act_as`` and ``read_as`` parties and the ``verbose`` flag is set.
                         Optional
            description: These commands are executed as a single atomic transaction.
        SubmitAndWaitForTransactionResponse:
            type: object
            properties:
                transaction:
                    allOf:
                        - $ref: '#/components/schemas/Transaction'
                    description: |-
                        The transaction that resulted from the submitted command.
                         The transaction might contain no events (request conditions result in filtering out all of them).
                         Required
        SubmitAndWaitResponse:
            type: object
            properties:
                update_id:
                    type: string
                    description: |-
                        The id of the transaction that resulted from the submitted command.
                         Must be a valid LedgerString (as described in ``value.proto``).
                         Required
                completion_offset:
                    type: string
                    description: |-
                        The details of the offset field are described in ``community/ledger-api/README.md``.
                         Required
        SubmitReassignmentRequest:
            type: object
            properties:
                reassignment_commands:
                    allOf:
                        - $ref: '#/components/schemas/ReassignmentCommands'
                    description: |-
                        The reassignment command to be submitted.
                         Required
        SubmitReassignmentResponse:
            type: object
            properties: {}
        SubmitResponse:
            type: object
            properties: {}
        SynchronizerTime:
            type: object
            properties:
                synchronizer_id:
                    type: string
                    description: |-
                        The id of the synchronizer.
                         Required
                record_time:
                    type: string
                    description: |-
                        All commands with a maximum record time below this value MUST be considered lost if their completion has not arrived before this checkpoint.
                         Required
                    format: date-time
        TemplateFilter:
            type: object
            properties:
                template_id:
                    allOf:
                        - $ref: '#/components/schemas/Identifier'
                    description: |-
                        A template for which the payload should be included in the response.
                         The ``template_id`` needs to be valid: corresponding template should be defined in
                         one of the available packages at the time of the query.
                         Both package-name and package-id reference formats for the identifier are supported.
                         Note: The package-id reference identifier format is deprecated. We plan to end support for this format in version 3.4.

                         Required
                include_created_event_blob:
                    type: boolean
                    description: |-
                        Whether to include a ``created_event_blob`` in the returned ``CreatedEvent``.
                         Use this to access the contract event payload in your API client
                         for submitting it as a disclosed contract with future commands.
                         Optional
            description: This filter matches contracts of a specific template.
        TextMap:
            type: object
            properties:
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/TextMap_Entry'
        TextMap_Entry:
            type: object
            properties:
                key:
                    type: string
                value:
                    $ref: '#/components/schemas/Value'
        TopologyEvent:
            type: object
            properties:
                participant_authorization_changed:
                    $ref: '#/components/schemas/ParticipantAuthorizationChanged'
                participant_authorization_revoked:
                    $ref: '#/components/schemas/ParticipantAuthorizationRevoked'
                participant_authorization_added:
                    $ref: '#/components/schemas/ParticipantAuthorizationAdded'
        TopologyFormat:
            type: object
            properties:
                include_participant_authorization_events:
                    allOf:
                        - $ref: '#/components/schemas/ParticipantAuthorizationTopologyFormat'
                    description: |-
                        Include participant authorization topology events in streams.
                         Optional, if unset no participant authorization topology events are emitted in the stream.
            description: A format specifying which topology transactions to include and how to render them.
        TopologyStateFilter:
            type: object
            properties:
                participant_ids:
                    type: array
                    items:
                        type: string
                    description: |-
                        If this list is non-empty, only vetted packages hosted on participants
                         listed in this field match the filter.
                         Query the current Ledger API's participant's ID via the public
                         ``GetParticipantId`` command in ``PartyManagementService``.
                synchronizer_ids:
                    type: array
                    items:
                        type: string
                    description: |-
                        If this list is non-empty, only vetted packages from the topology state of
                         the synchronizers in this list match the filter.
            description: |-
                Filter the vetted packages by the participant and synchronizer that they are
                 hosted on.

                 Empty fields are ignored, such that a ``TopologyStateFilter`` without
                 participant_ids and without synchronizer_ids matches a vetted package hosted
                 on any participant and synchronizer.

                 Non-empty fields specify candidate values of which at least one must match.
                 If both fields are set then at least one candidate value must match from each
                 field.
        TopologyTransaction:
            type: object
            properties:
                update_id:
                    type: string
                    description: |-
                        Assigned by the server. Useful for correlating logs.
                         Must be a valid LedgerString (as described in ``value.proto``).
                         Required
                offset:
                    type: string
                    description: |-
                        The absolute offset. The details of this field are described in ``community/ledger-api/README.md``.
                         Required, it is a valid absolute offset (positive integer).
                synchronizer_id:
                    type: string
                    description: |-
                        A valid synchronizer id.
                         Identifies the synchronizer that synchronized the topology transaction.
                         Required
                record_time:
                    type: string
                    description: |-
                        The time at which the changes in the topology transaction become effective. There is a small delay between a
                         topology transaction being sequenced and the changes it contains becoming effective. Topology transactions appear
                         in order relative to a synchronizer based on their effective time rather than their sequencing time.
                         Required
                    format: date-time
                events:
                    type: array
                    items:
                        $ref: '#/components/schemas/TopologyEvent'
                    description: |-
                        A non-empty list of topology events.
                         Required
                trace_context:
                    allOf:
                        - $ref: '#/components/schemas/TraceContext'
                    description: |-
                        Optional; ledger API trace context

                         The trace context transported in this message corresponds to the trace context supplied
                         by the client application in a HTTP2 header of the original command submission.
                         We typically use a header to transfer this type of information. Here we use message
                         body, because it is used in gRPC streams which do not support per message headers.
                         This field will be populated with the trace context contained in the original submission.
                         If that was not provided, a unique ledger-api-server generated trace context will be used
                         instead.
        TraceContext:
            type: object
            properties:
                traceparent:
                    type: string
                    description: https://www.w3.org/TR/trace-context/
                tracestate:
                    type: string
        Transaction:
            type: object
            properties:
                update_id:
                    type: string
                    description: |-
                        Assigned by the server. Useful for correlating logs.
                         Must be a valid LedgerString (as described in ``value.proto``).
                         Required
                command_id:
                    type: string
                    description: |-
                        The ID of the command which resulted in this transaction. Missing for everyone except the submitting party.
                         Must be a valid LedgerString (as described in ``value.proto``).
                         Optional
                workflow_id:
                    type: string
                    description: |-
                        The workflow ID used in command submission.
                         Must be a valid LedgerString (as described in ``value.proto``).
                         Optional
                effective_at:
                    type: string
                    description: |-
                        Ledger effective time.
                         Required
                    format: date-time
                events:
                    type: array
                    items:
                        $ref: '#/components/schemas/Event'
                    description: |-
                        The collection of events.
                         Contains:

                         - ``CreatedEvent`` or ``ArchivedEvent`` in case of ACS_DELTA transaction shape
                         - ``CreatedEvent`` or ``ExercisedEvent`` in case of LEDGER_EFFECTS transaction shape

                         Required
                offset:
                    type: string
                    description: |-
                        The absolute offset. The details of this field are described in ``community/ledger-api/README.md``.
                         Required, it is a valid absolute offset (positive integer).
                synchronizer_id:
                    type: string
                    description: |-
                        A valid synchronizer id.
                         Identifies the synchronizer that synchronized the transaction.
                         Required
                trace_context:
                    allOf:
                        - $ref: '#/components/schemas/TraceContext'
                    description: |-
                        Optional; ledger API trace context

                         The trace context transported in this message corresponds to the trace context supplied
                         by the client application in a HTTP2 header of the original command submission.
                         We typically use a header to transfer this type of information. Here we use message
                         body, because it is used in gRPC streams which do not support per message headers.
                         This field will be populated with the trace context contained in the original submission.
                         If that was not provided, a unique ledger-api-server generated trace context will be used
                         instead.
                record_time:
                    type: string
                    description: |-
                        The time at which the transaction was recorded. The record time refers to the synchronizer
                         which synchronized the transaction.
                         Required
                    format: date-time
                external_transaction_hash:
                    type: string
                    description: |-
                        For transaction externally signed, contains the external transaction hash
                         signed by the external party. Can be used to correlate an external submission with a committed transaction.
                         Optional
                    format: bytes
            description: Filtered view of an on-ledger transaction's create and archive events.
        TransactionFormat:
            type: object
            properties:
                event_format:
                    allOf:
                        - $ref: '#/components/schemas/EventFormat'
                    description: Required
                transaction_shape:
                    type: integer
                    description: |-
                        What transaction shape to use for interpreting the filters of the event format.
                         Required
                    format: enum
            description: |-
                A format that specifies what events to include in Daml transactions
                 and what data to compute and include for them.
        UnassignCommand:
            type: object
            properties:
                contract_id:
                    type: string
                    description: |-
                        The ID of the contract the client wants to unassign.
                         Must be a valid LedgerString (as described in ``value.proto``).
                         Required
                source:
                    type: string
                    description: |-
                        The ID of the source synchronizer
                         Must be a valid synchronizer id
                         Required
                target:
                    type: string
                    description: |-
                        The ID of the target synchronizer
                         Must be a valid synchronizer id
                         Required
            description: Unassign a contract
        UnassignedEvent:
            type: object
            properties:
                reassignment_id:
                    type: string
                    description: |-
                        The ID of the unassignment. This needs to be used as an input for a assign ReassignmentCommand.
                         Must be a valid LedgerString (as described in ``value.proto``).
                         Required
                contract_id:
                    type: string
                    description: |-
                        The ID of the reassigned contract.
                         Must be a valid LedgerString (as described in ``value.proto``).
                         Required
                template_id:
                    allOf:
                        - $ref: '#/components/schemas/Identifier'
                    description: |-
                        The template of the reassigned contract.
                         The identifier uses the package-id reference format.

                         Required
                source:
                    type: string
                    description: |-
                        The ID of the source synchronizer
                         Must be a valid synchronizer id
                         Required
                target:
                    type: string
                    description: |-
                        The ID of the target synchronizer
                         Must be a valid synchronizer id
                         Required
                submitter:
                    type: string
                    description: |-
                        Party on whose behalf the unassign command was executed.
                         Empty if the unassignment happened offline via the repair service.
                         Must be a valid PartyIdString (as described in ``value.proto``).
                         Optional
                reassignment_counter:
                    type: string
                    description: |-
                        Each corresponding assigned and unassigned event has the same reassignment_counter. This strictly increases
                         with each unassign command for the same contract. Creation of the contract corresponds to reassignment_counter
                         equals zero.
                         Required
                assignment_exclusivity:
                    type: string
                    description: |-
                        Assignment exclusivity
                         Before this time (measured on the target synchronizer), only the submitter of the unassignment can initiate the assignment
                         Defined for reassigning participants.
                         Optional
                    format: date-time
                witness_parties:
                    type: array
                    items:
                        type: string
                    description: |-
                        The parties that are notified of this event.
                         Required
                package_name:
                    type: string
                    description: |-
                        The package name of the contract.
                         Required
                offset:
                    type: string
                    description: |-
                        The offset of origin.
                         Offsets are managed by the participant nodes.
                         Reassignments can thus NOT be assumed to have the same offsets on different participant nodes.
                         Required, it is a valid absolute offset (positive integer)
                node_id:
                    type: integer
                    description: |-
                        The position of this event in the originating reassignment.
                         Node IDs are not necessarily equal across participants,
                         as these may see different projections/parts of reassignments.
                         Required, must be valid node ID (non-negative integer)
                    format: int32
            description: Records that a contract has been unassigned, and it becomes unusable on the source synchronizer
        UpdateFormat:
            type: object
            properties:
                include_transactions:
                    allOf:
                        - $ref: '#/components/schemas/TransactionFormat'
                    description: |-
                        Include Daml transactions in streams.
                         Optional, if unset, no transactions are emitted in the stream.
                include_reassignments:
                    allOf:
                        - $ref: '#/components/schemas/EventFormat'
                    description: |-
                        Include (un)assignments in the stream.
                         The events in the result take the shape TRANSACTION_SHAPE_ACS_DELTA.
                         Optional, if unset, no (un)assignments are emitted in the stream.
                include_topology_events:
                    allOf:
                        - $ref: '#/components/schemas/TopologyFormat'
                    description: |-
                        Include topology events in streams.
                         Optional, if unset no topology events are emitted in the stream.
            description: A format specifying what updates to include and how to render them.
        UpdateIdentityProviderConfigRequest:
            type: object
            properties:
                identity_provider_config:
                    allOf:
                        - $ref: '#/components/schemas/IdentityProviderConfig'
                    description: |-
                        The identity provider config to update.
                         Required,
                         Modifiable
                update_mask:
                    type: string
                    description: |-
                        An update mask specifies how and which properties of the ``IdentityProviderConfig`` message are to be updated.
                         An update mask consists of a set of update paths.
                         A valid update path points to a field or a subfield relative to the ``IdentityProviderConfig`` message.
                         A valid update mask must:

                         1. contain at least one update path,
                         2. contain only valid update paths.

                         Fields that can be updated are marked as ``Modifiable``.
                         For additional information see the documentation for standard protobuf3's ``google.protobuf.FieldMask``.
                         Required
                    format: field-mask
        UpdateIdentityProviderConfigResponse:
            type: object
            properties:
                identity_provider_config:
                    allOf:
                        - $ref: '#/components/schemas/IdentityProviderConfig'
                    description: Updated identity provider config
        UpdatePartyDetailsRequest:
            type: object
            properties:
                party_details:
                    allOf:
                        - $ref: '#/components/schemas/PartyDetails'
                    description: |-
                        Party to be updated
                         Required,
                         Modifiable
                update_mask:
                    type: string
                    description: |-
                        An update mask specifies how and which properties of the ``PartyDetails`` message are to be updated.
                         An update mask consists of a set of update paths.
                         A valid update path points to a field or a subfield relative to the ``PartyDetails`` message.
                         A valid update mask must:

                         1. contain at least one update path,
                         2. contain only valid update paths.

                         Fields that can be updated are marked as ``Modifiable``.
                         An update path can also point to non-``Modifiable`` fields such as 'party' and 'local_metadata.resource_version'
                         because they are used:

                         1. to identify the party details resource subject to the update,
                         2. for concurrent change control.

                         An update path can also point to non-``Modifiable`` fields such as 'is_local'
                         as long as the values provided in the update request match the server values.
                         Examples of update paths: 'local_metadata.annotations', 'local_metadata'.
                         For additional information see the documentation for standard protobuf3's ``google.protobuf.FieldMask``.
                         For similar Ledger API see ``com.daml.ledger.api.v2.admin.UpdateUserRequest``.
                         Required
                    format: field-mask
            description: 'Required authorization: ``HasRight(ParticipantAdmin) OR IsAuthenticatedIdentityProviderAdmin(party_details.identity_provider_id)``'
        UpdatePartyDetailsResponse:
            type: object
            properties:
                party_details:
                    allOf:
                        - $ref: '#/components/schemas/PartyDetails'
                    description: Updated party details
        UpdateUserIdentityProviderIdRequest:
            type: object
            properties:
                user_id:
                    type: string
                    description: User to update
                source_identity_provider_id:
                    type: string
                    description: Current identity provider ID of the user
                target_identity_provider_id:
                    type: string
                    description: Target identity provider ID of the user
            description: 'Required authorization: ``HasRight(ParticipantAdmin)``'
        UpdateUserIdentityProviderIdResponse:
            type: object
            properties: {}
        UpdateUserRequest:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: |-
                        The user to update.
                         Required,
                         Modifiable
                update_mask:
                    type: string
                    description: |-
                        An update mask specifies how and which properties of the ``User`` message are to be updated.
                         An update mask consists of a set of update paths.
                         A valid update path points to a field or a subfield relative to the ``User`` message.
                         A valid update mask must:

                         1. contain at least one update path,
                         2. contain only valid update paths.

                         Fields that can be updated are marked as ``Modifiable``.
                         An update path can also point to a non-``Modifiable`` fields such as 'id' and 'metadata.resource_version'
                         because they are used:

                         1. to identify the user resource subject to the update,
                         2. for concurrent change control.

                         Examples of valid update paths: 'primary_party', 'metadata', 'metadata.annotations'.
                         For additional information see the documentation for standard protobuf3's ``google.protobuf.FieldMask``.
                         For similar Ledger API see ``com.daml.ledger.api.v2.admin.UpdatePartyDetailsRequest``.
                         Required
                    format: field-mask
            description: 'Required authorization: ``HasRight(ParticipantAdmin) OR IsAuthenticatedIdentityProviderAdmin(user.identity_provider_id)``'
        UpdateUserResponse:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: Updated user
        UpdateVettedPackagesRequest:
            type: object
            properties:
                changes:
                    type: array
                    items:
                        $ref: '#/components/schemas/VettedPackagesChange'
                    description: |-
                        Changes to apply to the current vetting state of the participant on the
                         specified synchronizer. The changes are applied in order.
                         Any package not changed will keep their previous vetting state.
                dry_run:
                    type: boolean
                    description: |-
                        If dry_run is true, then the changes are only prepared, but not applied. If
                         a request would trigger an error when run (e.g. TOPOLOGY_DEPENDENCIES_NOT_VETTED),
                         it will also trigger an error when dry_run.

                         Use this flag to preview a change before applying it.
                synchronizer_id:
                    type: string
                    description: |-
                        If set, the requested changes will take place on the specified
                         synchronizer. If synchronizer_id is unset and the participant is only
                         connected to a single synchronizer, that synchronizer will be used by
                         default. If synchronizer_id is unset and the participant is connected to
                         multiple synchronizers, the request will error out with
                         PACKAGE_SERVICE_CANNOT_AUTODETECT_SYNCHRONIZER.

                         Optional
                expected_topology_serial:
                    allOf:
                        - $ref: '#/components/schemas/PriorTopologySerial'
                    description: |-
                        The serial of the last ``VettedPackages`` topology transaction of this
                         participant and on this synchronizer.

                         Execution of the request fails if this is not correct. Use this to guard
                         against concurrent changes.

                         If left unspecified, no validation is done against the last transaction's
                         serial.

                         Optional
                update_vetted_packages_force_flags:
                    type: array
                    items:
                        type: integer
                        format: enum
                    description: |-
                        Controls whether potentially unsafe vetting updates are allowed.

                         Optional, defaults to FORCE_FLAG_UNSPECIFIED.
        UpdateVettedPackagesResponse:
            type: object
            properties:
                past_vetted_packages:
                    allOf:
                        - $ref: '#/components/schemas/VettedPackages'
                    description: |-
                        All vetted packages on this participant and synchronizer, before the
                         specified changes. Empty if no vetting state existed beforehand.
                new_vetted_packages:
                    allOf:
                        - $ref: '#/components/schemas/VettedPackages'
                    description: All vetted packages on this participant and synchronizer, after the specified changes.
        UploadDarFileRequest:
            type: object
            properties:
                dar_file:
                    type: string
                    description: |-
                        Contains a Daml archive DAR file, which in turn is a jar like zipped
                         container for ``daml_lf`` archives. See further details in
                         ``daml_lf.proto``.
                         Required
                    format: bytes
                submission_id:
                    type: string
                    description: |-
                        Unique submission identifier.
                         Optional, defaults to a random identifier.
                vetting_change:
                    type: integer
                    description: How to vet packages in the DAR being uploaded
                    format: enum
                synchronizer_id:
                    type: string
                    description: |-
                        Only used if VettingChange is set to VETTING_CHANGE_VET_ALL_PACKAGES, in
                         order to specify which synchronizer to vet on.

                         If synchronizer_id is set, the synchronizer with this ID will be used. If
                         synchronizer_id is unset and the participant is only connected to a single
                         synchronizer, that synchronizer will be used by default. If synchronizer_id
                         is unset and the participant is connected to multiple synchronizers, the
                         request will error out with PACKAGE_SERVICE_CANNOT_AUTODETECT_SYNCHRONIZER.

                         Optional
        UploadDarFileResponse:
            type: object
            properties: {}
            description: A message that is received when the upload operation succeeded.
        User:
            type: object
            properties:
                id:
                    type: string
                    description: |-
                        The user identifier, which must be a non-empty string of at most 128
                         characters that are either alphanumeric ASCII characters or one of the symbols "@^$.!`-#+'~_|:()".
                         Required
                primary_party:
                    type: string
                    description: |-
                        The primary party as which this user reads and acts by default on the ledger
                         *provided* it has the corresponding ``CanReadAs(primary_party)`` or
                         ``CanActAs(primary_party)`` rights.
                         Ledger API clients SHOULD set this field to a non-empty value for all users to
                         enable the users to act on the ledger using their own Daml party.
                         Users for participant administrators MAY have an associated primary party.
                         Optional,
                         Modifiable
                is_deactivated:
                    type: boolean
                    description: |-
                        When set, then the user is denied all access to the Ledger API.
                         Otherwise, the user has access to the Ledger API as per the user's rights.
                         Optional,
                         Modifiable
                metadata:
                    allOf:
                        - $ref: '#/components/schemas/ObjectMeta'
                    description: |-
                        The metadata of this user.
                         Note that the ``metadata.resource_version`` tracks changes to the properties described by the ``User`` message and not the user's rights.
                         Optional,
                         Modifiable
                identity_provider_id:
                    type: string
                    description: |-
                        The ID of the identity provider configured by ``Identity Provider Config``
                         Optional, if not set, assume the user is managed by the default identity provider.
            description: |-
                Users are used to dynamically manage the rights given to Daml applications.
                 They are stored and managed per participant node.
        UserManagementFeature:
            type: object
            properties:
                supported:
                    type: boolean
                    description: Whether the Ledger API server provides the user management service.
                max_rights_per_user:
                    type: integer
                    description: |-
                        The maximum number of rights that can be assigned to a single user.
                         Servers MUST support at least 100 rights per user.
                         A value of 0 means that the server enforces no rights per user limit.
                    format: int32
                max_users_page_size:
                    type: integer
                    description: |-
                        The maximum number of users the server can return in a single response (page).
                         Servers MUST support at least a 100 users per page.
                         A value of 0 means that the server enforces no page size limit.
                    format: int32
        ValidateDarFileRequest:
            type: object
            properties:
                dar_file:
                    type: string
                    description: |-
                        Contains a Daml archive DAR file, which in turn is a jar like zipped
                         container for ``daml_lf`` archives. See further details in
                         ``daml_lf.proto``.
                         Required
                    format: bytes
                submission_id:
                    type: string
                    description: |-
                        Unique submission identifier.
                         Optional, defaults to a random identifier.
                synchronizer_id:
                    type: string
                    description: |-
                        If synchronizer_id is set, the synchronizer with this ID will be used. If
                         synchronizer_id is unset and the participant is only connected to a single
                         synchronizer, that synchronizer will be used by default. If synchronizer_id
                         is unset and the participant is connected to multiple synchronizers, the
                         request will error out with PACKAGE_SERVICE_CANNOT_AUTODETECT_SYNCHRONIZER.

                         Optional
            description: |-
                Performs the same checks that UploadDarFileRequest would perform, but doesn't
                 upload the DAR.
        ValidateDarFileResponse:
            type: object
            properties: {}
        Value:
            type: object
            properties:
                bool:
                    type: boolean
                    description: True or false.
                int64:
                    type: string
                date:
                    type: integer
                    description: |-
                        Days since the unix epoch. Can go backwards. Limited from
                         0001-01-01 to 9999-12-31, also to be compatible with
                         https://www.ietf.org/rfc/rfc3339.txt
                    format: int32
                timestamp:
                    type: string
                    description: |-
                        Microseconds since the UNIX epoch. Can go backwards. Fixed
                         since the vast majority of values will be greater than
                         2^28, since currently the number of microseconds since the
                         epoch is greater than that. Range: 0001-01-01T00:00:00Z to
                         9999-12-31T23:59:59.999999Z, so that we can convert to/from
                         https://www.ietf.org/rfc/rfc3339.txt
                numeric:
                    type: string
                    description: |-
                        A Numeric, that is a decimal value with precision 38 (at most 38 significant digits) and a
                         scale between 0 and 37 (significant digits on the right of the decimal point).
                         The field has to match the regex

                         .. code-block:: none

                           [+-]?\d{1,38}(.\d{0,37})?

                         and should be representable by a Numeric without loss of precision.
                party:
                    type: string
                    description: |-
                        An agent operating on the ledger.
                         Must be a valid PartyIdString.
                text:
                    type: string
                    description: A string.
                contract_id:
                    type: string
                    description: |-
                        Identifier of an on-ledger contract. Commands which reference an unknown or already archived contract ID will fail.
                         Must be a valid LedgerString.
                optional:
                    allOf:
                        - $ref: '#/components/schemas/Optional'
                    description: The Optional type, None or Some
                list:
                    allOf:
                        - $ref: '#/components/schemas/List'
                    description: Represents a homogeneous list of values.
                text_map:
                    allOf:
                        - $ref: '#/components/schemas/TextMap'
                    description: The TextMap type
                gen_map:
                    allOf:
                        - $ref: '#/components/schemas/GenMap'
                    description: The GenMap type
                record:
                    $ref: '#/components/schemas/Record'
                variant:
                    $ref: '#/components/schemas/Variant'
                enum:
                    allOf:
                        - $ref: '#/components/schemas/Enum'
                    description: The Enum type
            description: |-
                Encodes values that the ledger accepts as command arguments and emits as contract arguments.

                 The values encoding use different classes of non-empty strings as identifiers. Those classes are
                 defined as follows:

                 - NameStrings are strings with length <= 1000 that match the regexp ``[A-Za-z\$_][A-Za-z0-9\$_]*``.
                 - PackageIdStrings are strings with length <= 64 that match the regexp ``[A-Za-z0-9\-_ ]+``.
                 - PartyIdStrings are strings with length <= 255 that match the regexp ``[A-Za-z0-9:\-_ ]+``.
                 - LedgerStrings are strings with length <= 255 that match the regexp ``[A-Za-z0-9#:\-_/ ]+``.
                 - UserIdStrings are strings with length <= 128 that match the regexp ``[a-zA-Z0-9@^$.!`\-#+'~_|:]+``.
        Variant:
            type: object
            properties:
                variant_id:
                    allOf:
                        - $ref: '#/components/schemas/Identifier'
                    description: |-
                        Omitted from the transaction stream when verbose streaming is not enabled.
                         Optional when submitting commands.
                constructor:
                    type: string
                    description: |-
                        Determines which of the Variant's alternatives is encoded in this message.
                         Must be a valid NameString.
                         Required
                value:
                    allOf:
                        - $ref: '#/components/schemas/Value'
                    description: |-
                        The value encoded within the Variant.
                         Required
            description: A value with alternative representations.
        VettedPackage:
            type: object
            properties:
                package_id:
                    type: string
                    description: Package ID of this package. Always present.
                valid_from_inclusive:
                    type: string
                    description: |-
                        The time from which this package is vetted. Empty if vetting time has no
                         lower bound.
                    format: date-time
                valid_until_exclusive:
                    type: string
                    description: |-
                        The time until which this package is vetted. Empty if vetting time has no
                         upper bound.
                    format: date-time
                package_name:
                    type: string
                    description: |-
                        Name of this package.
                         Only available if the package has been uploaded to the current participant.
                         If unavailable, is empty string.
                package_version:
                    type: string
                    description: |-
                        Version of this package.
                         Only available if the package has been uploaded to the current participant.
                         If unavailable, is empty string.
            description: |-
                A package that is vetting on a given participant and synchronizer,
                 modelled after ``VettedPackage`` in `topology.proto <https://github.com/digital-asset/canton/blob/main/community/base/src/main/protobuf/com/digitalasset/canton/protocol/v30/topology.proto#L206>`_,
                 enriched with the package name and version.
        VettedPackages:
            type: object
            properties:
                packages:
                    type: array
                    items:
                        $ref: '#/components/schemas/VettedPackage'
                    description: |-
                        Sorted by package_name and package_version where known, and package_id as a
                         last resort.
                participant_id:
                    type: string
                    description: Participant on which these packages are vetted. Always present.
                synchronizer_id:
                    type: string
                    description: Synchronizer on which these packages are vetted. Always present.
                topology_serial:
                    type: integer
                    description: |-
                        Serial of last ``VettedPackages`` topology transaction of this participant
                         and on this synchronizer. Always present.
                    format: uint32
            description: |-
                The list of packages vetted on a given participant and synchronizer, modelled
                 after ``VettedPackages`` in `topology.proto <https://github.com/digital-asset/canton/blob/main/community/base/src/main/protobuf/com/digitalasset/canton/protocol/v30/topology.proto#L206>`_.
                 The list only contains packages that matched a filter in the query that
                 originated it.
        VettedPackagesChange:
            type: object
            properties:
                vet:
                    allOf:
                        - $ref: '#/components/schemas/VettedPackagesChange_Vet'
                    description: Add packages to or update packages in the set of vetted packages.
                unvet:
                    allOf:
                        - $ref: '#/components/schemas/VettedPackagesChange_Unvet'
                    description: Remove packages from the set of vetted packages.
            description: A change to the set of vetted packages.
        VettedPackagesChange_Unvet:
            type: object
            properties:
                packages:
                    type: array
                    items:
                        $ref: '#/components/schemas/VettedPackagesRef'
                    description: |-
                        Packages to be unvetted.

                         If a reference in this list matches multiple packages, they are all
                         unvetted.
            description: Remove packages from the set of vetted packages
        VettedPackagesChange_Vet:
            type: object
            properties:
                packages:
                    type: array
                    items:
                        $ref: '#/components/schemas/VettedPackagesRef'
                    description: |-
                        Packages to be vetted.

                         If a reference in this list matches more than one package, the change is
                         considered ambiguous and the entire update request is rejected. In other
                         words, every reference must match exactly one package.
                new_valid_from_inclusive:
                    type: string
                    description: |-
                        The time from which these packages should be vetted, prior lower bounds
                         are overwritten.
                         Optional
                    format: date-time
                new_valid_until_exclusive:
                    type: string
                    description: |-
                        The time until which these packages should be vetted, prior upper bounds
                         are overwritten.
                         Optional
                    format: date-time
            description: |-
                Set vetting bounds of a list of packages. Packages that were not previously
                 vetted have their bounds added, previous vetting bounds are overwritten.
        VettedPackagesRef:
            type: object
            properties:
                package_id:
                    type: string
                    description: |-
                        Package's package id must be the same as this field.
                         Optional
                package_name:
                    type: string
                    description: |-
                        Package's name must be the same as this field.
                         Optional
                package_version:
                    type: string
                    description: |-
                        Package's version must be the same as this field.
                         Optional
            description: |-
                A reference to identify one or more packages.

                 A reference matches a package if its ``package_id`` matches the package's ID,
                 its ``package_name`` matches the package's name, and its ``package_version``
                 matches the package's version. If an attribute in the reference is left
                 unspecified (i.e. as an empty string), that attribute is treated as a
                 wildcard. At a minimum, ``package_id`` or the ``package_name`` must be
                 specified.

                 If a reference does not match any package, the reference is considered
                 unresolved and the entire update request is rejected.
        WildcardFilter:
            type: object
            properties:
                include_created_event_blob:
                    type: boolean
                    description: |-
                        Whether to include a ``created_event_blob`` in the returned ``CreatedEvent``.
                         Use this to access the contract create event payload in your API client
                         for submitting it as a disclosed contract with future commands.
                         Optional
            description: This filter matches all templates.
tags:
    - name: CommandCompletionService
      description: |-
        Allows clients to observe the status of their submissions.
         Commands may be submitted via the Command Submission Service.
         The on-ledger effects of their submissions are disclosed by the Update Service.

         Commands may fail in 2 distinct manners:

         1. Failure communicated synchronously in the gRPC error of the submission.
         2. Failure communicated asynchronously in a Completion, see ``completion.proto``.

         Note that not only successfully submitted commands MAY produce a completion event. For example, the participant MAY
         choose to produce a completion event for a rejection of a duplicate command.

         Clients that do not receive a successful completion about their submission MUST NOT assume that it was successful.
         Clients SHOULD subscribe to the CompletionStream before starting to submit commands to prevent race conditions.
    - name: CommandService
      description: |-
        Command Service is able to correlate submitted commands with completion data, identify timeouts, and return contextual
         information with each tracking result. This supports the implementation of stateless clients.

         Note that submitted commands generally produce completion events as well, even in case a command gets rejected.
         For example, the participant SHOULD produce a completion event for a rejection of a duplicate command.
    - name: CommandSubmissionService
      description: |-
        Allows clients to attempt advancing the ledger's state by submitting commands.
         The final states of their submissions are disclosed by the Command Completion Service.
         The on-ledger effects of their submissions are disclosed by the Update Service.

         Commands may fail in 2 distinct manners:

         1. Failure communicated synchronously in the gRPC error of the submission.
         2. Failure communicated asynchronously in a Completion, see ``completion.proto``.

         Note that not only successfully submitted commands MAY produce a completion event. For example, the participant MAY
         choose to produce a completion event for a rejection of a duplicate command.

         Clients that do not receive a successful completion about their submission MUST NOT assume that it was successful.
         Clients SHOULD subscribe to the CompletionStream before starting to submit commands to prevent race conditions.
    - name: ContractService
      description: This service is experimental / alpha, therefore no backwards compatibility is guaranteed.
    - name: EventQueryService
      description: |-
        Query events by contract id.

         Note that querying by contract key is not (yet) supported, as contract keys
         are not supported (yet) in multi-synchronizer scenarios.
    - name: IdentityProviderConfigService
      description: |-
        Identity Provider Config Service makes it possible for participant node administrators
         to setup and manage additional identity providers at runtime.

         This allows using access tokens from identity providers unknown at deployment time. When an identity
         provider is configured, independent IDP administrators can manage their own set of parties and users.
         Such parties and users have a matching `identity_provider_id` defined and are inaccessible to
         administrators from other identity providers. A user will only be authenticated if the corresponding JWT
         token is issued by the appropriate identity provider.
         Users and parties without `identity_provider_id` defined are assumed to be using the default identity provider,
         which is configured statically at the participant node's deployment time.

         The Ledger API uses the "iss" claim of a JWT token to match the token to a specific IDP. If there is no match,
         the default IDP is assumed.

         The fields of request messages (and sub-messages) are marked either as ``Optional`` or ``Required``:

         1. ``Optional`` denoting the client may leave the field unset when sending a request.
         2. ``Required`` denoting the client must set the field to a non-default value when sending a request.

         An identity provider config resource is described by the ``IdentityProviderConfig`` message,
         An identity provider config resource, once it has been created, can be modified.
         In order to update the properties represented by the ``IdentityProviderConfig`` message use the ``UpdateIdentityProviderConfig`` RPC.
         The only fields that can be modified are those marked as ``Modifiable``.
    - name: InteractiveSubmissionService
      description: |-
        Service allowing interactive construction of command submissions

         The prepare and execute endpoints allow to submit commands in 2-steps:

         1. prepare transaction from commands,
         2. submit the prepared transaction

         This gives callers the ability to sign the daml transaction with their own signing keys
    - name: PackageManagementService
      description: |-
        Status: experimental interface, will change before it is deemed production
         ready

         Query the Daml-LF packages supported by the ledger participant and upload
         DAR files. We use 'backing participant' to refer to this specific participant
         in the methods of this API.
    - name: PackageService
      description: Allows clients to query the Daml-LF packages that are supported by the server.
    - name: PartyManagementService
      description: |-
        This service allows inspecting the party management state of the ledger known to the participant
         and managing the participant-local party metadata.

         The authorization rules for its RPCs are specified on the ``<RpcName>Request``
         messages as boolean expressions over these facts:

         1. ``HasRight(r)`` denoting whether the authenticated user has right ``r`` and
         2. ``IsAuthenticatedIdentityProviderAdmin(idp)`` denoting whether ``idp`` is equal to the ``identity_provider_id``
            of the authenticated user and the user has an IdentityProviderAdmin right.

         If `identity_provider_id` is set to an empty string, then it's effectively set to the value of access token's 'iss' field if that is provided.
         If `identity_provider_id` remains an empty string, the default identity provider will be assumed.

         The fields of request messages (and sub-messages) are marked either as ``Optional`` or ``Required``:

         1. ``Optional`` denoting the client may leave the field unset when sending a request.
         2. ``Required`` denoting the client must set the field to a non-default value when sending a request.

         A party details resource is described by the ``PartyDetails`` message,
         A party details resource, once it has been created, can be modified using the ``UpdatePartyDetails`` RPC.
         The only fields that can be modified are those marked as ``Modifiable``.
    - name: StateService
      description: Allows clients to get state from the ledger.
    - name: UpdateService
      description: |-
        Allows clients to read updates (transactions, (un)assignments, topology events) from the ledger.

         ``GetUpdates`` and ``GetUpdateTrees`` provide a comprehensive stream of updates/changes
         which happened on the virtual shared ledger. These streams are indexed with ledger
         offsets, which are strictly increasing.
         The virtual shared ledger consist of changes happening on multiple synchronizers which are
         connected to the serving participant. Each update belongs to one synchronizer, this is
         provided in the result (the ``synchronizer_id`` field in ``Transaction``
         for transactions, the ``source`` field in ``UnassignedEvent`` and the ``target`` field in ``AssignedEvent``).
         Consumers can rely on strong causal guarantees on the virtual shared ledger for a single
         synchronizer: updates which have greater offsets are happened after than updates with smaller
         offsets for the same synchronizer. Across different synchronizers this is not guaranteed.
    - name: UserManagementService
      description: |-
        Service to manage users and their rights for interacting with the Ledger API
         served by a participant node.

         The authorization rules for its RPCs are specified on the ``<RpcName>Request``
         messages as boolean expressions over these facts:

         1. ``HasRight(r)`` denoting whether the authenticated user has right ``r`` and
         2. ``IsAuthenticatedUser(uid)`` denoting whether ``uid`` is the empty string or equal to the id of the authenticated user.
         3. ``IsAuthenticatedIdentityProviderAdmin(idp)`` denoting whether ``idp`` is equal to the ``identity_provider_id``
            of the authenticated user and the user has an IdentityProviderAdmin right.

         If `user_id` is set to the empty string (the default), then the data for the authenticated user will be retrieved.
         If `identity_provider_id` is set to an empty string, then it's effectively set to the value of access token's 'iss' field if that is provided.
         If `identity_provider_id` remains an empty string, the default identity provider will be assumed.

         The fields of request messages (and sub-messages) are marked either as ``Optional`` or ``Required``:

         1. ``Optional`` denoting the client may leave the field unset when sending a request.
         2. ``Required`` denoting the client must set the field to a non-default value when sending a request.

         A user resource consists of:

         1. a set of properties represented by the ``User`` message,
         2. a set of user rights, where each right is represented by the ``Right`` message.

         A user resource, once it has been created, can be modified.
         In order to update the properties represented by the ``User`` message use the ``UpdateUser`` RPC. The only fields that can be modified are those marked as ``Modifiable``.
         In order to grant or revoke user rights use ``GrantRights' and ``RevokeRights`` RPCs.
    - name: VersionService
      description: Allows clients to retrieve information about the ledger API version

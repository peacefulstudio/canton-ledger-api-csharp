                    allOf:
                        - $ref: '#/components/schemas/GlobalKeyWithMaintainers'
                    description: |-
                        key to query for

                         Required
                result:
                    type: array
                    items:
                        type: string
                    description: |-
                        Result of the query: list of contract Ids matching the query

                         Optional: can be empty
        Reassignment:
            type: object
            properties:
                updateId:
                    type: string
                    description: |-
                        Assigned by the server. Useful for correlating logs.
                         Must be a valid LedgerString (as described in ``value.proto``).

                         Required
                commandId:
                    type: string
                    description: |-
                        The ID of the command which resulted in this reassignment. Missing for everyone except the submitting party on the submitting participant.
                         Must be a valid LedgerString (as described in ``value.proto``).

                         Optional
                workflowId:
                    type: string
                    description: |-
                        The workflow ID used in reassignment command submission. Only set if the ``workflow_id`` for the command was set.
                         Must be a valid LedgerString (as described in ``value.proto``).

                         Optional
                offset:
                    type: string
                    description: |-
                        The participant's offset. The details of this field are described in ``community/ledger-api/README.md``.
                         Must be a valid absolute offset (positive integer).

                         Required
                events:
                    type: array
                    items:
                        $ref: '#/components/schemas/ReassignmentEvent'
                    description: |-
                        The collection of reassignment events.

                         Required: must be non-empty
                traceContext:
                    allOf:
                        - $ref: '#/components/schemas/TraceContext'
                    description: |-
                        Ledger API trace context

                         The trace context transported in this message corresponds to the trace context supplied
                         by the client application in a HTTP2 header of the original command submission.
                         We typically use a header to transfer this type of information. Here we use message
                         body, because it is used in gRPC streams which do not support per message headers.
                         This field will be populated with the trace context contained in the original submission.
                         If that was not provided, a unique ledger-api-server generated trace context will be used
                         instead.

                         Optional
                recordTime:
                    type: string
                    description: |-
                        The time at which the reassignment was recorded. The record time refers to the source/target
                         synchronizer for an unassign/assign event respectively.

                         Required
                    format: date-time
                synchronizerId:
                    type: string
                    description: |-
                        A valid synchronizer id.
                         Identifies the synchronizer that synchronized this Reassignment.

                         Required
                paidTrafficCost:
                    type: string
                    description: |-
                        The traffic cost that this participant node paid for the corresponding (un)assignment request.

                         Not set for transactions that were
                         - initiated by another participant
                         - initiated offline via the repair service
                         - processed before the participant started serving traffic cost on the Ledger API
                         - returned as part of a query filtering for a non submitting party

                         Optional
            description: Complete view of an on-ledger reassignment.
        ReassignmentCommand:
            type: object
            properties:
                command:
                    allOf:
                        - $ref: '#/components/schemas/ReassignmentCommandCommand'
                    description: Required
        ReassignmentCommandCommand:
            type: object
            properties:
                UnassignCommand:
                    $ref: '#/components/schemas/UnassignCommand'
                AssignCommand:
                    $ref: '#/components/schemas/AssignCommand'
            description: Selects the reassignment a ``ReassignmentCommand`` requests.
        ReassignmentCommands:
            type: object
            properties:
                workflowId:
                    type: string
                    description: |-
                        Identifier of the on-ledger workflow that this command is a part of.
                         Must be a valid LedgerString (as described in ``value.proto``).

                         Optional
                userId:
                    type: string
                    description: |-
                        Uniquely identifies the participant user that issued the command.
                         Must be a valid UserIdString (as described in ``value.proto``).
                         Required unless authentication is used with a user token.
                         In that case, the token's user-id will be used for the request's user_id.

                         Optional
                commandId:
                    type: string
                    description: |-
                        Uniquely identifies the command.
                         The triple (user_id, submitter, command_id) constitutes the change ID for the intended ledger change.
                         The change ID can be used for matching the intended ledger changes with all their completions.
                         Must be a valid LedgerString (as described in ``value.proto``).

                         Required
                submitter:
                    type: string
                    description: |-
                        Party on whose behalf the command should be executed.
                         If ledger API authorization is enabled, then the authorization metadata must authorize the sender of the request
                         to act on behalf of the given party.
                         Must be a valid PartyIdString (as described in ``value.proto``).

                         Required
                submissionId:
                    type: string
                    description: |-
                        A unique identifier to distinguish completions for different submissions with the same change ID.
                         Typically a random UUID. Applications are expected to use a different UUID for each retry of a submission
                         with the same change ID.
                         Must be a valid LedgerString (as described in ``value.proto``).

                         If omitted, the participant or the committer may set a value of their choice.

                         Optional
                commands:
                    type: array
                    items:
                        $ref: '#/components/schemas/ReassignmentCommand'
                    description: |-
                        Individual elements of this reassignment. Must be non-empty.

                         Required: must be non-empty
        ReassignmentEvent:
            type: object
            properties:
                JsUnassignedEvent:
                    $ref: '#/components/schemas/UnassignedEvent'
                JsAssignmentEvent:
                    $ref: '#/components/schemas/AssignedEvent'
        Record:
            type: object
            properties:
                recordId:
                    allOf:
                        - $ref: '#/components/schemas/Identifier'
                    description: |-
                        Omitted from the transaction stream when verbose streaming is not enabled.
                         Optional when submitting commands.
                fields:
                    type: array
                    items:
                        $ref: '#/components/schemas/RecordField'
                    description: |-
                        The nested values of the record.
                         Required
            description: Contains nested values.
        RecordField:
            type: object
            properties:
                label:
                    type: string
                    description: |-
                        When reading a transaction stream, it's omitted if verbose streaming is not enabled.
                         When submitting a command, it's optional:

                         - if all keys within a single record are present, the order in which fields appear does not matter. however, each key must appear exactly once.
                         - if any of the keys within a single record are omitted, the order of fields MUST match the order of declaration in the Daml template.

                         Must be a valid NameString
                value:
                    allOf:
                        - $ref: '#/components/schemas/Value'
                    description: |-
                        A nested value of a record.
                         Required
            description: A named nested value within a record.
        RevokeUserRightsRequest:
            type: object
            properties:
                userId:
                    type: string
                    description: |-
                        The user from whom to revoke rights.

                         Required
                rights:
                    type: array
                    items:
                        $ref: '#/components/schemas/Right'
                    description: |-
                        The rights to revoke.

                         Optional: can be empty
                identityProviderId:
                    type: string
                    description: |-
                        The id of the ``Identity Provider``
                         If not set, assume the user is managed by the default identity provider.

                         Optional
            description: |-
                Remove the rights from the set of rights granted to the user.

                 Required authorization: ``HasRight(ParticipantAdmin) OR IsAuthenticatedIdentityProviderAdmin(identity_provider_id)``
        RevokeUserRightsResponse:
            type: object
            properties:
                newlyRevokedRights:
                    type: array
                    items:
                        $ref: '#/components/schemas/Right'
                    description: |-
                        The rights that were actually revoked by the request.

                         Optional: can be empty
        Right:
            type: object
            properties:
                kind:
                    allOf:
                        - $ref: '#/components/schemas/RightKind'
                    description: Required
            description: A right granted to a user.
        RightKind:
            type: object
            properties:
                ParticipantAdmin:
                    allOf:
                        - $ref: '#/components/schemas/Right_ParticipantAdmin'
                    description: The user can administer the participant node.
                CanActAs:
                    allOf:
                        - $ref: '#/components/schemas/Right_CanActAs'
                    description: The user can act as a specific party.
                CanReadAs:
                    allOf:
                        - $ref: '#/components/schemas/Right_CanReadAs'
                    description: The user can read ledger data visible to a specific party.
                IdentityProviderAdmin:
                    allOf:
                        - $ref: '#/components/schemas/Right_IdentityProviderAdmin'
                    description: The user can administer users and parties assigned to the same identity provider as the one of the user.
                CanReadAsAnyParty:
                    allOf:
                        - $ref: '#/components/schemas/Right_CanReadAsAnyParty'
                    description: The user can read as any party on a participant
                CanExecuteAs:
                    allOf:
                        - $ref: '#/components/schemas/Right_CanExecuteAs'
                    description: The user can prepare and execute submissions as a specific party.
                CanExecuteAsAnyParty:
                    allOf:
                        - $ref: '#/components/schemas/Right_CanExecuteAsAnyParty'
                    description: The user can prepare and execute submissions as any party on a participant.
            description: Selects which right a ``Right`` grants.
        Right_CanActAs:
            type: object
            properties:
                party:
                    type: string
                    description: |-
                        The right to authorize commands for this party.

                         Required
        Right_CanExecuteAs:
            type: object
            properties:
                party:
                    type: string
                    description: |-
                        The right to prepare and execute submissions as this party.
                         This right does not entitle the user to perform any reads.
                         If reading is required, a separate ReadAs right must be added.
                         Right to execute as a party is also implicitly contained in the CanActAs right.

                         Required
        Right_CanExecuteAsAnyParty:
            type: object
            properties: {}
            description: |-
                The rights of a user to prepare and execute transactions as any party.
                 Its utility is predominantly for users that perform interactive submissions
                 on behalf of many parties.
        Right_CanReadAs:
            type: object
            properties:
                party:

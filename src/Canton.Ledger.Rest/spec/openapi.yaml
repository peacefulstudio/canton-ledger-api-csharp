                        - $ref: '#/components/schemas/PriorTopologySerial_NoPrior'
                    description: No previous transaction exists.
            description: |-
                Selects whether a ``PriorTopologySerial`` asserts a previous transaction's
                 serial or the absence of any previous transaction.
        PriorTopologySerial_NoPrior:
            type: object
            properties: {}
            description: The absence of any previous ``VettedPackages`` topology transaction.
        QueryByKey:
            type: object

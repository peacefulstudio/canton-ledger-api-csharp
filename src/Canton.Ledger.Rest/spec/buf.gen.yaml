version: v2
inputs:
  - directory: .
    paths:
      - com/daml/ledger/api/v2
plugins:
  - remote: buf.build/community/google-gnostic-openapi:v0.7.0
    out: gen
    opt:
      - title=Canton Ledger API (proto-derived)
      - version=@CantonVersion@
      - naming=json
      - enum_type=string